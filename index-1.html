@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#0F0F0F;font-family:'DM Sans',sans-serif;color:#F2EBD9;min-height:100vh;overflow-x:hidden}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:#2A2A2A;border-radius:2px}
input[type=range]{-webkit-appearance:none;width:100%;height:4px;border-radius:2px;background:#2A2A2A;outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:#E05C2A;cursor:pointer}
input,select{background:#222;border:1px solid #2A2A2A;color:#F2EBD9;border-radius:8px;padding:.65rem .9rem;font-family:'DM Sans';font-size:.85rem;width:100%;outline:none;-webkit-appearance:none;appearance:none}
input:focus,select:focus{border-color:#E05C2A}
select option{background:#1A1A1A}
.btn{cursor:pointer;border:none;font-family:'DM Sans';transition:all .15s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulseRing{0%{transform:scale(1);opacity:.5}100%{transform:scale(1.6);opacity:0}}
</style>

function fmt(s) {
  return String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0');
}

function beep(freq=880, dur=0.15, vol=0.3) {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
    osc.start(); osc.stop(ctx.currentTime + dur);
  } catch(e) {}
}

// ── RENDER HELPERS ─────────────────────────────────────────────────────────────
function el(tag, attrs, ...children) {
  const e = document.createElement(tag);
  if (attrs) {
    Object.entries(attrs).forEach(([k,v]) => {
      if (k === 'style' && typeof v === 'object') Object.assign(e.style, v);
      else if (k === 'onclick') e.onclick = v;
      else if (k === 'oninput') e.oninput = v;
      else if (k === 'onchange') e.onchange = v;
      else if (k === 'innerHTML') e.innerHTML = v;
      else if (k === 'href') e.href = v;
      else if (k === 'target') e.target = v;
      else if (k === 'type') e.type = v;
      else if (k === 'value') e.value = v;
      else if (k === 'min') e.min = v;
      else if (k === 'max') e.max = v;
      else if (k === 'step') e.step = v;
      else if (k === 'accept') e.accept = v;
      else if (k === 'placeholder') e.placeholder = v;
      else if (k === 'loop') e.loop = v;
      else if (k === 'disabled') e.disabled = v;
      else e.setAttribute(k, v);
    });
  }
  children.flat().forEach(c => {
    if (c == null) return;
    if (typeof c === 'string' || typeof c === 'number') e.appendChild(document.createTextNode(c));
    else e.appendChild(c);
  });
  return e;
}

function div(style, ...children) { return el('div', {style}, ...children); }
function span(style, text) { const e = el('span', {style}); e.textContent = text; return e; }
function btn(style, text, onclick) { return el('button', {style, onclick, class:'btn'}, text); }

function svgThumb(id, size=66) {
  const d = div({
    width: size+'px', height: size+'px', borderRadius: '8px',
    background: 'linear-gradient(135deg,#1A1A1A,#242424)',
    border: '1px solid #2A2A2A', overflow: 'hidden', flexShrink: '0',
    display: 'flex', alignItems: 'center', justifyContent: 'center', padding: '4px'
  });
  if (SVG[id]) d.innerHTML = SVG[id];
  else d.textContent = catIcon('');
  return d;
}

function svgHero(id) {
  const d = div({width:'160px', height:'160px', margin:'0 auto', opacity:'0.9'});
  if (SVG[id]) d.innerHTML = SVG[id];
  return d;
}

  // Categoria

  catRow.appendChild(catSel);
  const newCatBtn = btn({padding:'.65rem .8rem',borderRadius:'8px',background:'none',border:'1px solid '+C.border,color:C.mist,fontSize:'.75rem',whiteSpace:'nowrap'}, '+ Nuova', () => {
    useCustomCat = true;
    catRow.innerHTML = '';
    const ci = el('input',{type:'text',placeholder:'Nome categoria...'});
    ci.oninput = e => { customCat = e.target.value; checkSave(); };
    catRow.appendChild(ci);
    const ab = btn({padding:'.65rem .8rem',borderRadius:'8px',background:'none',border:'1px solid '+C.border,color:C.mist,fontSize:'.75rem'}, '✕', () => { useCustomCat=false; customCat=''; catRow.innerHTML=''; catRow.appendChild(catSel); catRow.appendChild(newCatBtn); });
    catRow.appendChild(ab);
  });
  catRow.appendChild(newCatBtn);
  body.appendChild(catRow);

  // YouTube URL
  body.appendChild(div({fontSize:'.68rem',color:C.mist,letterSpacing:'.1em',textTransform:'uppercase',marginBottom:'.4rem'}, 'Link YouTube (opzionale)'));
  const ytInput = el('input',{type:'url',placeholder:'https://youtube.com/watch?v=...'});
  ytInput.oninput = e => { ytUrl = e.target.value; };
  body.appendChild(ytInput);
  body.appendChild(div({fontSize:'.66rem',color:C.mist,marginTop:'.3rem',marginBottom:'.9rem'}, "Cerca su YouTube, copia l'URL dalla barra."));

  // Buttons
  const btnRow = div({display:'flex',gap:'.7rem',marginTop:'1rem'});
  btnRow.appendChild(btn({flex:'1',padding:'.9rem',borderRadius:'10px',background:'none',border:'1px solid '+C.border,color:C.mist,fontSize:'.85rem'}, 'Annulla', () => { state.showAdd=false; render(); }));
  const saveBtn = btn({flex:'2',padding:'.9rem',borderRadius:'10px',background:C.border,border:'none',color:C.white,fontFamily:"'Bebas Neue'",fontSize:'1.15rem',letterSpacing:'.06em'}, 'SALVA', () => {
    const finalCat = useCustomCat ? customCat.trim() : cat;
    if (name.trim().length < 2 || !finalCat) return;
    state.customExs.push({id:'c_'+Date.now(),name:name.trim(),cat:finalCat,target:'',cues:[],yt:ytUrl.trim(),custom:true});
    saveCustom();
    state.showAdd = false;
    render();
  });
  function checkSave() {
    const finalCat = useCustomCat ? customCat.trim() : cat;
    const ok = name.trim().length >= 2 && finalCat.length > 0;
    saveBtn.style.background = ok ? C.green : C.border;
    saveBtn.style.cursor = ok ? 'pointer' : 'not-allowed';
  }
  btnRow.appendChild(saveBtn);
  body.appendChild(btnRow);
  sheet.appendChild(body);
  overlay.appendChild(sheet);
  return overlay;

  }
  return wrap;

function exCard(ex) {
  const isSel = state.selected.some(e=>e.id===ex.id);
  const card = div({border:'1px solid '+(isSel?C.ember:C.border),borderRadius:'12px',overflow:'hidden',background:isSel?C.emberD:C.surface,transition:'all .15s'});
  const inner = div({display:'flex',gap:'.85rem',padding:'.8rem'});

  // thumb
  const thumb = svgThumb(ex.id, 66);
  thumb.style.cursor = 'pointer';
  thumb.onclick = () => { state.modalEx=ex; render(); };
  inner.appendChild(thumb);

  // info
  const info = div({flex:'1',minWidth:'0'});
  const topRow = div({display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:'.4rem'});
  const nameBtn = btn({background:'none',border:'none',padding:'0',fontWeight:'600',fontSize:'.88rem',color:C.white,textAlign:'left',textDecoration:'underline',textDecorationColor:'rgba(255,255,255,.2)',cursor:'pointer'}, ex.name, () => { state.modalEx=ex; render(); });
  const catRow = div({display:'flex',alignItems:'center',gap:'.4rem',marginTop:'.15rem'});
  catRow.appendChild(div({fontSize:'.65rem',color:C.ember,letterSpacing:'.07em',textTransform:'uppercase'}, ex.cat));
  if (ex.custom) catRow.appendChild(div({fontSize:'.58rem',background:C.greenD,color:C.green,padding:'.05rem .4rem',borderRadius:'2rem',textTransform:'uppercase'}, 'custom'));
  const nameWrap = div({flex:'1',minWidth:'0'});
  nameWrap.appendChild(nameBtn);
  nameWrap.appendChild(catRow);
  if (ex.target) nameWrap.appendChild(div({fontSize:'.71rem',color:C.mist,marginTop:'.1rem',lineHeight:'1.35'}, ex.target));
  topRow.appendChild(nameWrap);

  // checkbox
  const check = div({width:'26px',height:'26px',borderRadius:'50%',flexShrink:'0',cursor:'pointer',border:'2px solid '+(isSel?C.ember:C.border),background:isSel?C.ember:'none',display:'flex',alignItems:'center',justifyContent:'center',color:C.white,fontSize:'.72rem',transition:'all .15s'}, isSel?'✓':'');
  check.onclick = () => {
    if (isSel) state.selected = state.selected.filter(e=>e.id!==ex.id);
    else state.selected.push(ex);
    render();
  };
  topRow.appendChild(check);
  info.appendChild(topRow);
  inner.appendChild(info);
  card.appendChild(inner);
  return card;
}

      const nb = btn({flex:'1',background:'none',border:'none',padding:'0',fontSize:'.83rem',color:C.sand,textAlign:'left',textDecoration:'underline',textDecorationColor:'rgba(242,235,217,.22)',cursor:'pointer'}, ex.name, () => { state.modalEx=ex; render(); });
      row.appendChild(nb);
      if (ex.custom) row.appendChild(span({fontSize:'.58rem',color:C.green,border:'1px solid rgba(34,197,94,0.27)',padding:'.1rem .35rem',borderRadius:'2rem'}, 'custom'));
      row.appendChild(btn({background:'none',border:'none',color:C.mist,fontSize:'.9rem',cursor:'pointer'}, '✕', () => { state.selected=state.selected.filter(e=>e.id!==ex.id); render(); }));
      selBox.appendChild(row);
    });
  }
  selBox.appendChild(btn({marginTop:'.65rem',fontSize:'.73rem',color:C.ember,background:'none',border:'none',cursor:'pointer',padding:'0'}, '+ Aggiungi esercizi', () => { state.tab='library'; render(); }));
  wrap.appendChild(selBox);

  // Sliders
  [
    {label:'Tempo lavoro',key:'workTime',min:15,max:90,step:5,unit:'"',color:C.ember},
    {label:'Riposo tra esercizi',key:'restTime',min:10,max:60,step:5,unit:'"',color:C.rest},
    {label:'Serie',key:'series',min:1,max:6,step:1,unit:'',color:C.green},
    {label:'Riposo tra serie',key:'restBetween',min:30,max:180,step:15,unit:'"',color:C.rest},
  ].forEach(({label,key,min,max,step,unit,color}) => {
    const box = div({background:C.surface,border:'1px solid '+C.border,borderRadius:'12px',padding:'.85rem',marginBottom:'.65rem'});
    const top = div({display:'flex',justifyContent:'space-between',marginBottom:'.55rem'});
    top.appendChild(span({fontSize:'.8rem',color:C.sand}, label));
    const valSpan = span({fontFamily:"'Bebas Neue'",fontSize:'1.4rem',color,lineHeight:'1'}, state[key]+unit);
    top.appendChild(valSpan);
    box.appendChild(top);
    const slider = el('input',{type:'range',min,max,step,value:state[key]});
    slider.style.accentColor = color;
    slider.oninput = e => { state[key]=Number(e.target.value); valSpan.textContent=state[key]+unit; };
    box.appendChild(slider);
    const range = div({display:'flex',justifyContent:'space-between',marginTop:'.18rem'});
    range.appendChild(span({fontSize:'.6rem',color:C.mist}, min+unit));
    range.appendChild(span({fontSize:'.6rem',color:C.mist}, max+unit));
    box.appendChild(range);
    wrap.appendChild(box);
  });

  // Audio section
  const audioBox = div({background:C.surface,border:'1px solid '+C.border,borderRadius:'12px',padding:'.85rem',marginBottom:'.85rem'});
  audioBox.appendChild(div({fontSize:'.63rem',letterSpacing:'.12em',color:C.mist,textTransform:'uppercase',marginBottom:'.7rem'}, '🎵 Musica'));

  if (!state.audioFile) {
    const fileLabel = el('label',{style:{display:'flex',alignItems:'center',gap:'.7rem',padding:'.7rem .9rem',borderRadius:'8px',border:'1px dashed '+C.border,cursor:'pointer',background:C.surface2}});
    fileLabel.appendChild(span({fontSize:'1.4rem'}, '📂'));
    const txt = div({});
    txt.appendChild(div({fontSize:'.8rem',color:C.sand,fontWeight:'600'}, 'Carica file audio'));
    txt.appendChild(div({fontSize:'.65rem',color:C.mist,marginTop:'.1rem'}, 'MP3, AAC, M4A, WAV'));
    fileLabel.appendChild(txt);
    const fileInput = el('input',{type:'file',accept:'audio/*'});
    fileInput.style.display = 'none';
    fileInput.onchange = e => {
      const f = e.target.files && e.target.files[0];
      if (!f) return;
      if (state.audioFile && state.audioFile.url) URL.revokeObjectURL(state.audioFile.url);
      state.audioFile = {name:f.name, url:URL.createObjectURL(f)};
      state.audioPlaying = false;
      render();
    };
    fileLabel.appendChild(fileInput);
    audioBox.appendChild(fileLabel);
  } else {
    // audio element (hidden, persistent)
    if (!audioEl) { audioEl = el('audio',{loop:true}); document.body.appendChild(audioEl); }
    if (audioEl.src !== state.audioFile.url) audioEl.src = state.audioFile.url;
    audioEl.volume = state.audioVol;

    const fileRow = div({display:'flex',alignItems:'center',gap:'.6rem',marginBottom:'.7rem'});
    fileRow.appendChild(span({fontSize:'1.1rem'}, '🎵'));
    fileRow.appendChild(div({flex:'1',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',fontSize:'.78rem',color:C.sand,fontWeight:'600'}, state.audioFile.name));
    fileRow.appendChild(btn({background:'none',border:'none',color:C.mist,cursor:'pointer',fontSize:'1rem',flexShrink:'0'}, '✕', () => {
      if (audioEl) { audioEl.pause(); audioEl.src=''; }
      if (state.audioFile && state.audioFile.url) URL.revokeObjectURL(state.audioFile.url);
      state.audioFile=null; state.audioPlaying=false; render();
    }));
    audioBox.appendChild(fileRow);

    const controls = div({display:'flex',alignItems:'center',gap:'.7rem'});
    const playBtn = btn({width:'36px',height:'36px',borderRadius:'50%',background:state.audioPlaying?C.emberD:C.ember,border:'1px solid '+C.ember,color:C.white,fontSize:'1rem',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:'0'}, state.audioPlaying?'⏸':'▶', () => {
      if (state.audioPlaying) { audioEl.pause(); state.audioPlaying=false; }
      else { audioEl.play().catch(()=>{}); state.audioPlaying=true; }
      render();
    });
    controls.appendChild(playBtn);
    const volRow = div({flex:'1',display:'flex',alignItems:'center',gap:'.5rem'});
    volRow.appendChild(span({fontSize:'.75rem'},'🔈'));
    const volSlider = el('input',{type:'range',min:'0',max:'1',step:'0.05',value:state.audioVol});
    volSlider.style.accentColor = C.ember;
    volSlider.oninput = e => { state.audioVol=Number(e.target.value); if(audioEl) audioEl.volume=state.audioVol; };
    volRow.appendChild(volSlider);
    volRow.appendChild(span({fontSize:'.75rem'},'🔊'));
    controls.appendChild(volRow);
    audioBox.appendChild(controls);
  }

  // External URL
  const extDiv = div({marginTop:'.8rem',paddingTop:'.7rem',borderTop:'1px solid '+C.border});
  extDiv.appendChild(div({fontSize:'.63rem',color:C.mist,marginBottom:'.4rem'}, 'Oppure apri link esterno (Spotify / YouTube)'));
  const urlRow = div({display:'flex',gap:'.5rem'});
  const urlInput = el('input',{type:'url',placeholder:'https://...'});
  urlInput.value = state.musicUrl;
  urlInput.oninput = e => { state.musicUrl = e.target.value; };
  urlRow.appendChild(urlInput);
  if (state.musicUrl) {
    urlRow.appendChild(btn({padding:'.65rem .8rem',borderRadius:'8px',background:C.emberD,border:'1px solid rgba(224,92,42,.27)',color:C.ember,fontSize:'.75rem',whiteSpace:'nowrap'}, 'Apri', () => window.open(state.musicUrl,'_blank')));
  }
  extDiv.appendChild(urlRow);
  audioBox.appendChild(extDiv);
  wrap.appendChild(audioBox);

  // Summary
  const totalTime = state.selected.length
    ? state.series*(state.selected.length*state.workTime+(state.selected.length-1)*state.restTime)+(state.series-1)*state.restBetween
    : 0;
  const sumBox = div({background:C.emberD,border:'1px solid rgba(224,92,42,.2)',borderRadius:'12px',padding:'.85rem',marginBottom:'1rem'});
  sumBox.appendChild(div({fontSize:'.63rem',letterSpacing:'.12em',color:C.ember,textTransform:'uppercase',marginBottom:'.45rem'}, 'Riepilogo'));
  const grid = div({display:'grid',gridTemplateColumns:'1fr 1fr 1fr',textAlign:'center'});
  [[state.series,'Serie'],[state.selected.length,'Esercizi'],[fmt(totalTime),'Durata']].forEach(([v,l]) => {
    const cell = div({});
    cell.appendChild(div({fontFamily:"'Bebas Neue'",fontSize:'1.6rem',color:C.ember,lineHeight:'1'}, String(v)));
    cell.appendChild(div({fontSize:'.6rem',color:C.mist,letterSpacing:'.08em',textTransform:'uppercase'}, l));
    grid.appendChild(cell);
  });
  sumBox.appendChild(grid);
  wrap.appendChild(sumBox);

  // Start button
  const startBtn = btn({width:'100%',padding:'1.1rem',borderRadius:'12px',background:state.selected.length?C.ember:C.border,border:'none',color:C.white,fontFamily:"'Bebas Neue'",fontSize:'1.4rem',letterSpacing:'.08em'}, '▶ AVVIA WORKOUT', () => {
    if (!state.selected.length) return;
    buildWorkout();
    if (state.musicUrl) window.open(state.musicUrl,'_blank');
    state.tab='player'; render();
  });
  wrap.appendChild(startBtn);
  return wrap;
}

// ── WORKOUT LOGIC ─────────────────────────────────────────────────────────────
function buildWorkout() {
  const seq = [];
  for (let s=0; s<state.series; s++) {
    state.selected.forEach((ex,i) => {
      seq.push({type:'work',ex,serie:s+1,dur:state.workTime});
      const last = i===state.selected.length-1;
      if (!last) seq.push({type:'rest',ex:state.selected[i+1],serie:s+1,dur:state.restTime});
      else if (s<state.series-1) seq.push({type:'series-rest',ex:state.selected[0],serie:s+2,dur:state.restBetween});
    });
  }
  seq.push({type:'end'});
  state.workout = seq;
  state.phase = {idx:0,...seq[0],timeLeft:seq[0].dur};
  state.running = false;
  state.done = false;
}

function startTimer() {
  if (timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    if (!state.running || !state.phase || state.phase.type==='end') return;
    const next = state.phase.timeLeft - 1;
    if (next <= 3 && next > 0) {
      const f = state.phase.type==='work' ? 523 : state.phase.type==='series-rest' ? 392 : 440;
      beep(f, .1, .18);
    }
    if (next <= 0) {
      const f = state.phase.type==='work' ? 660 : state.phase.type==='series-rest' ? 523 : 440;
      beep(f, .22);
      const ni = state.phase.idx + 1;
      if (!state.workout[ni] || state.workout[ni].type==='end') {
        clearInterval(timerInterval);
        state.running = false; state.done = true;
        beep(880,.3); setTimeout(()=>beep(1100,.3),250);
      } else {
        state.phase = {...state.workout[ni], idx:ni, timeLeft:state.workout[ni].dur};
      }
    } else {
      state.phase.timeLeft = next;
    }
    renderPlayer();
  }, 1000);
}

// ── PLAYER TAB ────────────────────────────────────────────────────────────────
function renderPlayer() {
  const app = document.getElementById('app');
  const existing = document.getElementById('player-view');
  const newPlayer = buildPlayerView();
  if (existing) existing.replaceWith(newPlayer);
  else app.appendChild(newPlayer);
}

function buildPlayerView() {
  const wrap = div({flex:'1',display:'flex',flexDirection:'column'});
  wrap.id = 'player-view';

  if (state.done) {
    const done = div({flex:'1',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:'2rem',textAlign:'center'});
    done.appendChild(div({fontSize:'4rem',marginBottom:'1rem'}, '🏆'));
    done.appendChild(div({fontFamily:"'Bebas Neue'",fontSize:'3rem',color:C.ember,lineHeight:'1'}, 'WORKOUT\nCOMPLETATO'));
    done.appendChild(div({color:C.mist,margin:'1rem 0 2rem',fontSize:'.85rem'}, `${state.series} serie · ${state.selected.length} esercizi`));
    done.appendChild(btn({width:'100%',padding:'1rem',borderRadius:'12px',background:C.ember,border:'none',color:C.white,fontFamily:"'Bebas Neue'",fontSize:'1.2rem',marginBottom:'.8rem'}, '↺ Ripeti', () => { buildWorkout(); state.tab='player'; render(); }));
    done.appendChild(btn({width:'100%',padding:'1rem',borderRadius:'12px',background:C.surface,border:'1px solid '+C.border,color:C.sand,fontSize:'.85rem'}, '← Builder', () => { clearInterval(timerInterval); state.tab='builder'; render(); }));
    wrap.appendChild(done);
    return wrap;
  }

  const ph = state.phase;
  if (!ph) return wrap;
  const isWork = ph.type==='work';
  const isSRest = ph.type==='series-rest';
  const accent = isWork ? C.ember : C.rest;
  const steps = state.workout.filter(w=>w.type!=='end');

  // Progress bar
  const prog = div({padding:'.7rem 1rem',display:'flex',alignItems:'center',gap:'.8rem',borderBottom:'1px solid '+C.border});
  prog.appendChild(btn({background:'none',border:'none',color:C.mist,fontSize:'1.1rem',cursor:'pointer'}, '←', () => { clearInterval(timerInterval); state.running=false; state.tab='builder'; render(); }));
  const progInfo = div({flex:'1'});
  progInfo.appendChild(div({fontSize:'.6rem',color:C.mist,letterSpacing:'.1em',textTransform:'uppercase',marginBottom:'.22rem'},
    isWork ? `Serie ${ph.serie} · ${ph.ex&&ph.ex.name}` : isSRest ? `Fine serie ${ph.serie-1}` : 'Riposo'));
  const bar = div({height:'3px',background:C.border,borderRadius:'2px'});
  const fill = div({height:'100%',borderRadius:'2px',background:accent,width:Math.round((ph.idx/Math.max(steps.length-1,1))*100)+'%',transition:'width .6s'});
  bar.appendChild(fill);
  progInfo.appendChild(bar);
  prog.appendChild(progInfo);
  prog.appendChild(span({fontSize:'.7rem',color:C.mist}, (ph.idx+1)+'/'+steps.length));
  wrap.appendChild(prog);

  // Hero SVG
  if (ph.ex) {
    const hero = div({position:'relative',height:'210px',background:'linear-gradient(135deg,#111,#1E1E1E)',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:'.5rem',overflow:'hidden'});

    const svgWrap = div({width:'150px',height:'150px',opacity: isWork ? '0.85' : '0.3'});
    if (SVG[ph.ex.id]) svgWrap.innerHTML = SVG[ph.ex.id];
    else svgWrap.textContent = catIcon(ph.ex.cat);
    hero.appendChild(svgWrap);

    const badge = div({position:'absolute',top:'.8rem',left:'.8rem',background:accent,color:C.white,fontSize:'.6rem',fontWeight:'700',letterSpacing:'.12em',textTransform:'uppercase',padding:'.2rem .55rem',borderRadius:'2rem'}, isWork?'● LAVORO':'◉ RIPOSO');
    hero.appendChild(badge);

    const nameBlock = div({position:'absolute',bottom:'.8rem',left:'1rem',right:'1rem'});
    const nb = btn({background:'none',border:'none',padding:'0',fontFamily:"'Bebas Neue'",fontSize:'1.6rem',color:isWork?C.white:C.mist,letterSpacing:'.03em',lineHeight:'1',textDecoration:'underline',textDecorationColor:'rgba(255,255,255,.28)',cursor:'pointer',textAlign:'left'},
      isWork ? ph.ex.name : isSRest ? 'Prossima: '+ph.ex.name : 'Prossimo: '+ph.ex.name,
      () => { state.modalEx=ph.ex; render(); });
    nameBlock.appendChild(nb);
    if (isWork && ph.ex.target) nameBlock.appendChild(div({fontSize:'.68rem',color:C.emberL,marginTop:'.18rem'}, ph.ex.target));
    hero.appendChild(nameBlock);
    wrap.appendChild(hero);
  }

  // Timer circle
  const timerWrap = div({display:'flex',flexDirection:'column',alignItems:'center',padding:'1.2rem 1rem .7rem'});
  const circ = 2*Math.PI*45;
  const dash = circ*(1-ph.timeLeft/(ph.dur||1));
  const svgTimer = document.createElementNS('http://www.w3.org/2000/svg','svg');
  svgTimer.setAttribute('width','140'); svgTimer.setAttribute('height','140');
  svgTimer.style.transform = 'rotate(-90deg)';
  const cBg = document.createElementNS('http://www.w3.org/2000/svg','circle');
  cBg.setAttribute('cx','70'); cBg.setAttribute('cy','70'); cBg.setAttribute('r','45');
  cBg.setAttribute('fill','none'); cBg.setAttribute('stroke',C.border); cBg.setAttribute('stroke-width','6');
  const cFg = document.createElementNS('http://www.w3.org/2000/svg','circle');
  cFg.setAttribute('cx','70'); cFg.setAttribute('cy','70'); cFg.setAttribute('r','45');
  cFg.setAttribute('fill','none'); cFg.setAttribute('stroke',accent); cFg.setAttribute('stroke-width','6');
  cFg.setAttribute('stroke-linecap','round');
  cFg.setAttribute('stroke-dasharray',String(circ));
  cFg.setAttribute('stroke-dashoffset',String(dash));
  cFg.style.transition = 'stroke-dashoffset .9s linear';
  svgTimer.appendChild(cBg); svgTimer.appendChild(cFg);

  const timerBox = div({position:'relative',width:'140px',height:'140px'});
  timerBox.appendChild(svgTimer);
  const timerText = div({position:'absolute',inset:'0',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center'});
  timerText.appendChild(div({fontFamily:"'Bebas Neue'",fontSize:'2.6rem',color:ph.timeLeft<=3&&isWork?C.ember:C.white,lineHeight:'1',transition:'color .2s'}, fmt(ph.timeLeft)));
  timerText.appendChild(div({fontSize:'.57rem',color:C.mist,letterSpacing:'.1em',textTransform:'uppercase'}, isWork?'lavoro':'riposo'));
  timerBox.appendChild(timerText);
  timerWrap.appendChild(timerBox);

  if (isWork && ph.ex && ph.ex.cues && ph.ex.cues[0]) {
    timerWrap.appendChild(div({marginTop:'.65rem',padding:'.5rem .85rem',background:C.emberD,borderRadius:'8px',fontSize:'.72rem',color:C.emberL,fontStyle:'italic',textAlign:'center',maxWidth:'320px'}, ph.ex.cues[0]));
  }
  if (!isWork) {
    timerWrap.appendChild(div({marginTop:'.65rem',padding:'.5rem .85rem',background:C.restD,borderRadius:'8px',fontSize:'.72rem',color:C.rest,textAlign:'center',maxWidth:'320px'}, isSRest?'Fine serie. Recupera e preparati.':'Respira. Prossimo esercizio tra poco.'));
  }
  wrap.appendChild(timerWrap);

  // Controls
  const ctrl = div({padding:'0 1rem .8rem',display:'flex',gap:'.7rem',marginTop:'auto'});
  ctrl.appendChild(btn({flex:'1',padding:'.9rem',borderRadius:'12px',background:C.surface,border:'1px solid '+C.border,color:C.sand,fontSize:'.82rem'}, '↺', () => {
    clearInterval(timerInterval); state.running=false; state.done=false;
    state.phase={idx:0,...state.workout[0],timeLeft:state.workout[0].dur};
    renderPlayer();
  }));
  const playPause = btn({flex:'3',padding:'.9rem',borderRadius:'12px',background:state.running?C.surface:accent,border:state.running?'1px solid '+C.border:'none',color:state.running?C.sand:C.white,fontFamily:"'Bebas Neue'",fontSize:'1.3rem',letterSpacing:'.06em'},
    state.running?'⏸ PAUSA':'▶ AVVIA', () => {
    state.running = !state.running;
    if (state.running) startTimer();
    else clearInterval(timerInterval);
    renderPlayer();
  });
  ctrl.appendChild(playPause);
  wrap.appendChild(ctrl);

  // Mini audio player
  if (state.audioFile) {
    if (!audioEl) { audioEl = el('audio',{loop:true}); document.body.appendChild(audioEl); }
    if (audioEl.src !== state.audioFile.url) { audioEl.src = state.audioFile.url; audioEl.volume = state.audioVol; }
    const mini = div({margin:'0 1rem 1rem',padding:'.6rem .9rem',background:C.surface,border:'1px solid '+C.border,borderRadius:'10px',display:'flex',alignItems:'center',gap:'.7rem'});
    const ap = btn({width:'30px',height:'30px',borderRadius:'50%',background:state.audioPlaying?C.emberD:C.ember,border:'none',color:C.white,fontSize:'.85rem',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:'0'}, state.audioPlaying?'⏸':'▶', () => {
      if (state.audioPlaying) { audioEl.pause(); state.audioPlaying=false; }
      else { audioEl.play().catch(()=>{}); state.audioPlaying=true; }
      renderPlayer();
    });
    mini.appendChild(ap);
    const mn = div({flex:'1',minWidth:'0'});
    mn.appendChild(div({fontSize:'.68rem',color:C.sand,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',marginBottom:'.25rem'}, state.audioFile.name));
    const vs = el('input',{type:'range',min:'0',max:'1',step:'0.05',value:state.audioVol});
    vs.style.accentColor = C.ember; vs.style.width='100%';
    vs.oninput = e => { state.audioVol=Number(e.target.value); if(audioEl) audioEl.volume=state.audioVol; };
    mn.appendChild(vs);
    mini.appendChild(mn);
    wrap.appendChild(mini);
  }

  return wrap;
}

// ── MAIN RENDER ───────────────────────────────────────────────────────────────
function render() {
  const app = document.getElementById('app');
  app.innerHTML = '';
  app.style.cssText = 'max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column';

  // NAV
  const nav = el('nav',{style:{display:'flex',borderBottom:'1px solid '+C.border,background:C.bg,position:'sticky',top:'0',zIndex:'100'}});
  const tabs = [['library','📚 Libreria'],['circuits','⚡ Circuiti'],['builder',`⚙️${state.selected.length?' ('+state.selected.length+')':''}`]];
  if (state.tab==='player') tabs.push(['player','▶ Player']);
  tabs.forEach(([v,label]) => {
    const active = state.tab===v;
    const b = btn({flex:'1',padding:'.85rem .3rem',background:'none',border:'none',fontSize:'.7rem',fontWeight:'600',color:active?C.ember:C.mist,borderBottom:active?'2px solid '+C.ember:'2px solid transparent',transition:'color .2s',whiteSpace:'nowrap'}, label, () => { state.tab=v; render(); });
    nav.appendChild(b);
  });
  app.appendChild(nav);

  // Content
  if (state.tab==='library') app.appendChild(renderLibrary());
  else if (state.tab==='circuits') app.appendChild(renderCircuits());
  else if (state.tab==='builder') app.appendChild(renderBuilder());
  else if (state.tab==='player') app.appendChild(buildPlayerView());

  // Modals
  const modal = renderModal();
  if (modal) app.appendChild(modal);
  const addModal = renderAddModal();
  if (addModal) app.appendChild(addModal);
}

render();
</script>
