@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#0F0F0F;font-family:'DM Sans',sans-serif;color:#F2EBD9;min-height:100vh;overflow-x:hidden}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:#2A2A2A;border-radius:2px}
input[type=range]{-webkit-appearance:none;width:100%;height:4px;border-radius:2px;background:#2A2A2A;outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:#E05C2A;cursor:pointer}
input,select{background:#222;border:1px solid #2A2A2A;color:#F2EBD9;border-radius:8px;padding:.65rem .9rem;font-family:'DM Sans';font-size:.85rem;width:100%;outline:none;-webkit-appearance:none;appearance:none}
input:focus,select:focus{border-color:#E05C2A}
select option{background:#1A1A1A}
.btn{cursor:pointer;border:none;font-family:'DM Sans';transition:all .15s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulseRing{0%{transform:scale(1);opacity:.5}100%{transform:scale(1.6);opacity:0}}
</style>

const EXERCISES = [
{id:1,name:"Kettlebell Halo",cat:"Core & Mobilità",target:"Obliqui · Spalle · Mobilità toracica",yt:"https://www.youtube.com/watch?v=Sci3lijQBmk",cues:["Tieni il KB a due mani davanti al petto, fondo verso l'alto.","Ruota lentamente attorno alla testa (~3 sec/giro).","Il busto rimane fermo — si muovono solo spalle e braccia.","Alterna direzione ogni 20\"."]},
{id:2,name:"Goblet Squat",cat:"Full Body",target:"Quadricipiti · Glutei · Core",yt:"https://www.youtube.com/watch?v=FcTOmJW0G6U",cues:["KB verticale a due mani all'altezza del petto.","Piedi oltre larghezza spalle, punte fuori.","Scendi con petto alto — gomiti toccano le ginocchia.","Spingi sui talloni per risalire."]},
{id:3,name:"Around the World",cat:"Core & Mobilità",target:"Core 360° · Obliqui · Coordinazione",yt:"https://www.youtube.com/watch?v=XzqwVP_wSpc",cues:["KB in una mano davanti alle cosce.","Ruota il KB attorno al corpo, passa da una mano all'altra.","Busto fisso — le anche non ruotano.","Cambia direzione ogni 20\"."]},
{id:4,name:"Single-Leg Deadlift",cat:"Posteriori",target:"Femorali · Glutei · Equilibrio",yt:"https://www.youtube.com/watch?v=IDtmRPFNBk8",cues:["In piedi su una gamba, KB nella mano opposta.","Inclinati in avanti dall'anca come un'altalena.","La gamba libera sale dietro, KB scende parallelo alla tibia.","Nessun movimento dalla lombare."]},
{id:5,name:"Press in Piedi",cat:"Spalle & Upper",target:"Spalle · Core laterale · Stabilità",yt:"https://www.youtube.com/watch?v=0eW8av1WC4g",cues:["KB in rack sulla spalla, polso dritto.","Premi sopra la testa in linea con la spalla.","Contrai il gluteo del lato che preme.","Non inarcare la schiena."]},
{id:6,name:"Suitcase Carry",cat:"Core & Mobilità",target:"Obliqui · Grip · Postura anti-laterale",yt:"https://www.youtube.com/watch?v=Uc5rP5xs7qQ",cues:["KB in una mano, braccio disteso lungo il fianco.","La spalla carica non deve abbassarsi.","Gli obliqui del lato opposto lavorano isometricamente.","Passo lento e controllato."]},
{id:7,name:"Wood Chops",cat:"Core & Mobilità",target:"Obliqui · Rotatori · Potenza rotazionale",yt:"https://www.youtube.com/watch?v=V3XtAjWFLdU",cues:["KB a due mani, arco diagonale dall'alto-laterale al basso.","Ruota il busto, non solo le braccia.","Movimento esplosivo in discesa, controllato in risalita.","x6 per lato."]},
{id:8,name:"High Pulls",cat:"Spalle & Upper",target:"Trapezi · Spalle · Schiena alta",yt:"https://www.youtube.com/watch?v=ITSmgn_BQgY",cues:["Parti con il KB basso tra le gambe.","Tira con i gomiti alti verso il petto in modo esplosivo.","Il KB sale fino al petto — coinvolgi schiena e spalle.","Nessuno slancio delle braccia."]},
{id:9,name:"Curl & Press",cat:"Spalle & Upper",target:"Bicipiti → Spalle · Transizione fluida",yt:"https://www.youtube.com/watch?v=IkcOjDnHwyI",cues:["Esegui prima un curl portando il KB al petto.","Poi pressa sopra la testa fino a completa estensione.","Gomiti vicini al corpo durante il curl.","Movimento lento e controllato."]},
{id:10,name:"Horizontal Press",cat:"Spalle & Upper",target:"Petto · Tricipiti · Core stabilizzatore",yt:"https://www.youtube.com/watch?v=EZWHnzAjctU",cues:["Spingi in avanti in linea orizzontale.","Non inarcare la schiena — core contratto.","Puoi eseguirlo da seduto o in ginocchio.","2 sec andata, 2 sec ritorno."]},
{id:11,name:"Reverse Lunge",cat:"Gambe & Glutei",target:"Quadricipiti · Glutei · Equilibrio",yt:"https://www.youtube.com/watch?v=JiQboHyV9aE",cues:["Tieni il KB al petto o in una mano.","Fai un passo indietro ampio — ginocchio posteriore verso terra.","Il ginocchio anteriore non supera la punta del piede.","Spingi sul tallone della gamba davanti per tornare."]},
{id:12,name:"Romanian Deadlift",cat:"Posteriori",target:"Femorali · Glutei · Schiena bassa controllata",yt:"https://www.youtube.com/watch?v=JCXUYuzwNrM",cues:["KB in entrambe le mani davanti alle cosce.","Inclina il busto spingendo i fianchi indietro.","Schiena neutra per tutta l'esecuzione.","Scendi fino allo stretch nei femorali, risali lentamente."]},
{id:13,name:"Goblet Squat & Press",cat:"Full Body",target:"Gambe · Spalle · Core · Composto",yt:"https://www.youtube.com/watch?v=sIX71MwChNg",cues:["Parti in posizione goblet squat con il KB al petto.","Scendi in squat profondo con schiena neutra.","In risalita, pressa il KB sopra la testa a braccia tese.","Abbassa il KB al petto prima del prossimo squat."]},
{id:14,name:"Dead Bug",cat:"Core & Mobilità",target:"Core profondo · Stabilità lombare · Coordinazione",yt:"https://www.youtube.com/watch?v=4XLEnwUr1d8",cues:["Sdraiato sulla schiena, braccia verso il soffitto, ginocchia a 90°.","Abbassa il braccio destro e la gamba sinistra simultaneamente.","La schiena bassa rimane incollata al pavimento per tutta l'esecuzione.","Risali lentamente e alterna i lati. 20\" per lato."]},
{id:15,name:"Bird Dog",cat:"Core & Mobilità",target:"Core · Stabilità lombopelvica · Coordinazione",yt:"https://www.youtube.com/watch?v=wiFNA3sqjCA",cues:["In quadrupedia, schiena neutra, core attivo.","Estendi il braccio destro e la gamba sinistra contemporaneamente.","Mantieni i fianchi paralleli al pavimento — non ruotare.","Tieni 2 sec, rientra lentamente. 20\" per lato."]},
{id:16,name:"Side Plank",cat:"Core & Mobilità",target:"Obliqui · Core laterale · Stabilità",yt:"https://www.youtube.com/watch?v=K2KACpntMqo",cues:["Appoggio sul gomito o sulla mano, corpo in linea retta.","Fianchi sollevati, non cedere verso il basso.","Guarda in avanti, collo neutro.","20\" per lato."]},
{id:17,name:"Plank KB Drag",cat:"Core & Mobilità",target:"Core · Anti-rotazione · Spalle",yt:"https://www.youtube.com/watch?v=_6PsqGi3KDg",cues:["In posizione plank alta, KB a lato della mano destra.","Con la mano sinistra trascina il KB dall'altro lato.","Evita qualsiasi rotazione del bacino durante il trascinamento.","Alterna i lati per tutta la durata."]},
{id:18,name:"Suitcase March",cat:"Core & Mobilità",target:"Obliqui · Anti-inclinazione · Stabilità · Equilibrio",yt:"https://www.youtube.com/watch?v=8DeHFfBFMT4",cues:["KB in una mano, posizione eretta.","Solleva il ginocchio opposto fino all'altezza dell'anca, lentamente.","La spalla del lato carico non deve abbassarsi.","Passo lento e controllato. 20\" per lato."]},
{id:19,name:"Seated KB Transfer",cat:"Core & Mobilità",target:"Obliqui · Core · Rotazione controllata",yt:"https://www.youtube.com/watch?v=6RlFpHFLcpQ",cues:["Seduto a terra, gambe divaricate, schiena dritta.","KB a lato del fianco destro.","Ruota il busto e sposta il KB davanti al corpo fino al lato sinistro.","Mantieni la schiena neutra — il movimento parte dal core."]},
{id:20,name:"Lateral Lunge",cat:"Gambe & Glutei",target:"Adduttori · Glutei · Quadricipiti · Mobilità anche",yt:"https://www.youtube.com/watch?v=gwLzBJYoWlI",cues:["KB al petto a due mani, piedi uniti.","Fai un ampio passo laterale, piegando il ginocchio del lato che avanza.","La gamba opposta rimane tesa.","Spingi sul tallone per tornare. 20\" per lato."]},
{id:21,name:"Split Squat",cat:"Gambe & Glutei",target:"Quadricipiti · Glutei · Stabilità · Forza unilaterale",yt:"https://www.youtube.com/watch?v=1vS1NQXF0Oc",cues:["Un piede avanti e uno indietro, in posizione di affondo.","KB in una mano o al petto.","Scendi verticalmente — il ginocchio posteriore verso il pavimento.","Mantieni il busto eretto per tutta l'esecuzione. 20\" per lato."]},
{id:22,name:"Kettlebell Row",cat:"Spalle & Upper",target:"Dorsali · Romboidi · Bicipiti · Core",yt:"https://www.youtube.com/watch?v=6TSP1TRMUzs",cues:["Busto inclinato a ~45°, KB in una mano, braccio teso.","Tira il gomito verso il soffitto, KB verso il fianco.","La spalla del lato che lavora sale leggermente alla fine del movimento.","Abbassa lentamente. 20\" per lato."]},
{id:23,name:"Glute Bridge",cat:"Posteriori",target:"Glutei · Femorali · Core · Stabilità bacino",yt:"https://www.youtube.com/watch?v=OUgsJ8-Vi0E",cues:["Sdraiato sulla schiena, ginocchia piegate, piedi a terra.","KB appoggiato sui fianchi/basso addome.","Spingi i fianchi verso il soffitto contraendo i glutei.","In cima, tieni 1 sec. Scendi lentamente senza toccare terra."]},
{id:24,name:"Russian Swing",cat:"Full Body",target:"Glutei · Femorali · Core · Esplosività",yt:"https://www.youtube.com/watch?v=sSESeQAir2M",cues:["Piedi oltre larghezza spalle, KB tra le gambe.","Il movimento parte dall'anca — non è uno squat.","Spingi i fianchi in avanti in modo esplosivo per lanciare il KB.","Il KB sale fino all'altezza delle spalle — non oltre."]},

return String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0');
}

// Comprimi immagine: max 400px, JPEG 0.65
function compressImage(file, callback) {
const reader = new FileReader();
reader.onload = e => {
const img = new Image();
img.onload = () => {
const MAX = 400;
let w = img.width, h = img.height;
if (w > h && w > MAX) { h = Math.round(h * MAX / w); w = MAX; }
else if (h > w && h > MAX) { w = Math.round(w * MAX / h); h = MAX; }
else if (w > MAX) { w = MAX; h = MAX; }
const canvas = document.createElement('canvas');
canvas.width = w; canvas.height = h;
canvas.getContext('2d').drawImage(img, 0, 0, w, h);
callback(canvas.toDataURL('image/jpeg', 0.65));
};
img.src = e.target.result;
};
reader.readAsDataURL(file);
}

// ── AUDIO BIP ─────────────────────────────────────────────────────────────────
function beep(freq=880, dur=0.15, vol=0.7) {
try {
const ctx = new (window.AudioContext || window.webkitAudioContext)();
const osc = ctx.createOscillator();
const gain = ctx.createGain();
osc.connect(gain); gain.connect(ctx.destination);
osc.frequency.value = freq;
gain.gain.setValueAtTime(vol, ctx.currentTime);
gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
osc.start(); osc.stop(ctx.currentTime + dur);
} catch(e) {}
}

function beepLong(freq=660, dur=1.5, vol=0.8) {
try {
const ctx = new (window.AudioContext || window.webkitAudioContext)();
const osc = ctx.createOscillator();
const gain = ctx.createGain();
osc.connect(gain); gain.connect(ctx.destination);
osc.frequency.value = freq;
gain.gain.setValueAtTime(vol, ctx.currentTime);
gain.gain.setValueAtTime(vol, ctx.currentTime + dur - 0.2);
gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
osc.start(); osc.stop(ctx.currentTime + dur);
} catch(e) {}
}

// ── RENDER HELPERS ─────────────────────────────────────────────────────────────
function el(tag, attrs, ...children) {
const e = document.createElement(tag);
if (attrs) {
Object.entries(attrs).forEach(([k,v]) => {
if (k === 'style' && typeof v === 'object') Object.assign(e.style, v);
else if (k === 'onclick') e.onclick = v;
else if (k === 'oninput') e.oninput = v;
else if (k === 'onchange') e.onchange = v;
else if (k === 'innerHTML') e.innerHTML = v;
else if (k === 'href') e.href = v;
else if (k === 'target') e.target = v;
else if (k === 'type') e.type = v;
else if (k === 'value') e.value = v;
else if (k === 'min') e.min = v;
else if (k === 'max') e.max = v;
else if (k === 'step') e.step = v;
else if (k === 'accept') e.accept = v;
else if (k === 'placeholder') e.placeholder = v;
else if (k === 'loop') e.loop = v;
else if (k === 'disabled') e.disabled = v;
else e.setAttribute(k, v);
});
}
children.flat().forEach(c => {
if (c == null) return;
if (typeof c === 'string' || typeof c === 'number') e.appendChild(document.createTextNode(c));
else e.appendChild(c);
});
return e;
}

function div(style, ...children) { return el('div', {style}, ...children); }
function span(style, text) { const e = el('span', {style}); e.textContent = text; return e; }
function btn(style, text, onclick) { return el('button', {style, onclick, class:'btn'}, text); }

function svgThumb(ex, size=66) {
const mainImg = getExMainImg(ex);
const d = div({
width: size+'px', height: size+'px', borderRadius: '8px',
background: 'linear-gradient(135deg,#1A1A1A,#242424)',
border: '1px solid #2A2A2A', overflow: 'hidden', flexShrink: '0',
display: 'flex', alignItems: 'center', justifyContent: 'center', padding: mainImg ? '0' : '4px'
});
if (mainImg) {
const img = el('img', {});
img.src = mainImg;
img.style.cssText = 'width:100%;height:100%;object-fit:cover;border-radius:7px';
d.appendChild(img);
} else if (SVG[ex.id]) {
d.innerHTML = SVG[ex.id];
} else {
d.textContent = catIcon(ex.cat);
}
return d;
}

const imgs = getExImgs(ex);
const gallery = div({display:'flex', gap:'.6rem', overflowX:'auto', paddingBottom:'.4rem'});
gallery.style.scrollbarWidth = 'none';

imgs.forEach((src, idx) => {
const frame = div({position:'relative', flexShrink:'0'});

// ── WORKOUT LOGIC ─────────────────────────────────────────────────────────────
let audioEl = null;
let timerInterval = null;

function buildWorkout() {
const seq = [];
for (let s=0; s<state.series; s++) {
state.selected.forEach((ex,i) => {
seq.push({type:'work',ex,serie:s+1,dur:state.workTime});
const last = i===state.selected.length-1;
if (!last) seq.push({type:'rest',ex:state.selected[i+1],serie:s+1,dur:state.restTime});
else if (s<state.series-1) seq.push({type:'series-rest',ex:state.selected[0],serie:s+2,dur:state.restBetween});
});
}
seq.push({type:'end'});
state.workout = seq;
state.phase = {idx:0,...seq[0],timeLeft:seq[0].dur};
state.running = false;
state.done = false;
}

function startTimer() {
if (timerInterval) clearInterval(timerInterval);
timerInterval = setInterval(() => {
if (!state.running || !state.phase || state.phase.type==='end') return;
const next = state.phase.timeLeft - 1;

// Countdown 5 bip
if (next <= 5 && next > 0) {
const f = state.phase.type==='work' ? 523 : state.phase.type==='series-rest' ? 392 : 440;
beep(f, 0.12, 0.75);
}

if (next <= 0) {
// Bip lungo cambio fase
const f = state.phase.type==='work' ? 660 : state.phase.type==='series-rest' ? 523 : 440;
beepLong(f, 1.5, 0.85);

const ni = state.phase.idx + 1;
if (!state.workout[ni] || state.workout[ni].type==='end') {
clearInterval(timerInterval);
state.running = false; state.done = true;
setTimeout(() => { beep(880,0.3,0.85); setTimeout(()=>beep(1100,0.4,0.85),280); }, 1600);
} else {
state.phase = {...state.workout[ni], idx:ni, timeLeft:state.workout[ni].dur};
}
} else {
state.phase.timeLeft = next;
}
renderPlayer();
}, 1000);
}

() => { state.modalEx=ph.ex; render(); });
nameBlock.appendChild(nb);
if (isWork && ph.ex.target) nameBlock.appendChild(div({fontSize:'.68rem',color:C.emberL,marginTop:'.18rem'}, ph.ex.target));
hero.appendChild(nameBlock);
wrap.appendChild(hero);
}

// Timer circle
const timerWrap = div({display:'flex',flexDirection:'column',alignItems:'center',padding:'1.2rem 1rem .7rem'});
const circ = 2*Math.PI*45;
const dash = circ*(1-ph.timeLeft/(ph.dur||1));

const svgTimer = document.createElementNS('http://www.w3.org/2000/svg','svg');
svgTimer.setAttribute('width','140'); svgTimer.setAttribute('height','140');
svgTimer.style.transform = 'rotate(-90deg)';
const cBg = document.createElementNS('http://www.w3.org/2000/svg','circle');
cBg.setAttribute('cx','70'); cBg.setAttribute('cy','70'); cBg.setAttribute('r','45');
cBg.setAttribute('fill','none'); cBg.setAttribute('stroke',C.border); cBg.setAttribute('stroke-width','6');
const cFg = document.createElementNS('http://www.w3.org/2000/svg','circle');
cFg.setAttribute('cx','70'); cFg.setAttribute('cy','70'); cFg.setAttribute('r','45');
cFg.setAttribute('fill','none'); cFg.setAttribute('stroke',accent); cFg.setAttribute('stroke-width','6');
cFg.setAttribute('stroke-linecap','round');
cFg.setAttribute('stroke-dasharray',String(circ));
cFg.setAttribute('stroke-dashoffset',String(dash));
cFg.style.transition = 'stroke-dashoffset .9s linear';
svgTimer.appendChild(cBg); svgTimer.appendChild(cFg);

const timerBox = div({position:'relative',width:'140px',height:'140px'});
timerBox.appendChild(svgTimer);
const timerText = div({position:'absolute',inset:'0',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center'});
timerText.appendChild(div({fontFamily:"'Bebas Neue'",fontSize:'2.6rem',color:ph.timeLeft<=5&&isWork?C.ember:C.white,lineHeight:'1',transition:'color .2s'}, fmt(ph.timeLeft)));
timerText.appendChild(div({fontSize:'.57rem',color:C.mist,letterSpacing:'.1em',textTransform:'uppercase'}, isWork?'lavoro':'riposo'));
timerBox.appendChild(timerText);
timerWrap.appendChild(timerBox);

if (isWork && ph.ex && ph.ex.cues && ph.ex.cues[0]) {
timerWrap.appendChild(div({marginTop:'.65rem',padding:'.5rem .85rem',background:C.emberD,borderRadius:'8px',fontSize:'.72rem',color:C.emberL,fontStyle:'italic',textAlign:'center',maxWidth:'320px'}, ph.ex.cues[0]));
}
if (!isWork) {
timerWrap.appendChild(div({marginTop:'.65rem',padding:'.5rem .85rem',background:C.restD,borderRadius:'8px',fontSize:'.72rem',color:C.rest,textAlign:'center',maxWidth:'320px'}, isSRest?'Fine serie. Recupera e preparati.':'Respira. Prossimo esercizio tra poco.'));
}
wrap.appendChild(timerWrap);

// Controls
const ctrl = div({padding:'0 1rem .8rem',display:'flex',gap:'.7rem',marginTop:'auto'});
ctrl.appendChild(btn({flex:'1',padding:'.9rem',borderRadius:'12px',background:C.surface,border:'1px solid '+C.border,color:C.sand,fontSize:'.82rem'}, '↺', () => {
clearInterval(timerInterval); state.running=false; state.done=false;
state.phase={idx:0,...state.workout[0],timeLeft:state.workout[0].dur};
renderPlayer();
}));
const playPause = btn({flex:'3',padding:'.9rem',borderRadius:'12px',background:state.running?C.surface:accent,border:state.running?'1px solid '+C.border:'none',color:state.running?C.sand:C.white,fontFamily:"'Bebas Neue'",fontSize:'1.3rem',letterSpacing:'.06em'},
state.running?'⏸ PAUSA':'▶ AVVIA', () => {
state.running = !state.running;
if (state.running) startTimer();
else clearInterval(timerInterval);
renderPlayer();
});
ctrl.appendChild(playPause);
wrap.appendChild(ctrl);

// Mini audio player
if (state.audioFile) {
if (!audioEl) { audioEl = el('audio',{loop:true}); document.body.appendChild(audioEl); }
if (audioEl.src !== state.audioFile.url) { audioEl.src = state.audioFile.url; audioEl.volume = state.audioVol; }
const mini = div({margin:'0 1rem 1rem',padding:'.6rem .9rem',background:C.surface,border:'1px solid '+C.border,borderRadius:'10px',display:'flex',alignItems:'center',gap:'.7rem'});
const ap = btn({width:'30px',height:'30px',borderRadius:'50%',background:state.audioPlaying?C.emberD:C.ember,border:'none',color:C.white,fontSize:'.85rem',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:'0'}, state.audioPlaying?'⏸':'▶', () => {
if (state.audioPlaying) { audioEl.pause(); state.audioPlaying=false; }
else { audioEl.play().catch(()=>{}); state.audioPlaying=true; }
renderPlayer();
});
mini.appendChild(ap);
const mn = div({flex:'1',minWidth:'0'});
mn.appendChild(div({fontSize:'.68rem',color:C.sand,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',marginBottom:'.25rem'}, state.audioFile.name));
const vs = el('input',{type:'range',min:'0',max:'1',step:'0.05',value:state.audioVol});
vs.style.accentColor = C.ember; vs.style.width='100%';
vs.oninput = e => { state.audioVol=Number(e.target.value); if(audioEl) audioEl.volume=state.audioVol; };
mn.appendChild(vs);
mini.appendChild(mn);
wrap.appendChild(mini);
}
return wrap;
}

// ── MAIN RENDER ───────────────────────────────────────────────────────────────
function render() {
const app = document.getElementById('app');
app.innerHTML = '';
app.style.cssText = 'max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column';

const nav = el('nav',{style:{display:'flex',borderBottom:'1px solid '+C.border,background:C.bg,position:'sticky',top:'0',zIndex:'100'}});
const tabs = [
['library','📚'],
['circuits','🔄'],
['builder', state.selected.length ? `⚙️ ${state.selected.length}` : '⚙️'],
['videos','🎬'],
];
if (state.tab==='player') tabs.push(['player','▶️']);
tabs.forEach(([v,label]) => {
const active = state.tab===v;
nav.appendChild(btn({flex:'1',padding:'.85rem .3rem',background:'none',border:'none',fontSize:'1.1rem',color:active?C.ember:C.mist,borderBottom:active?'2px solid '+C.ember:'2px solid transparent',transition:'color .2s'}, label, () => {
if (v==='player' && !state.workout) return;
state.tab=v; render();
}));
});
app.appendChild(nav);

if (state.tab==='library') app.appendChild(renderLibrary());
else if (state.tab==='circuits') app.appendChild(renderCircuits());
else if (state.tab==='builder') app.appendChild(renderBuilder());
else if (state.tab==='videos') app.appendChild(renderVideos());
else if (state.tab==='player') app.appendChild(buildPlayerView());

const modal = renderModal();
if (modal) app.appendChild(modal);
const addModal = renderAddModal();
if (addModal) app.appendChild(addModal);
const videoModal = renderAddVideoModal();
if (videoModal) app.appendChild(videoModal);
}

render();
</script>
</body>
</html>
