<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>KB Workout Builder</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap');
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#0F0F0F;font-family:'DM Sans',sans-serif;color:#F2EBD9;min-height:100vh;overflow-x:hidden}
  ::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:#2A2A2A;border-radius:2px}
  input[type=range]{-webkit-appearance:none;width:100%;height:4px;border-radius:2px;background:#2A2A2A;outline:none}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#E05C2A;cursor:pointer}
  input,select{background:#222;border:1px solid #2A2A2A;color:#F2EBD9;border-radius:8px;padding:.65rem .9rem;font-family:'DM Sans';font-size:.85rem;width:100%;outline:none;-webkit-appearance:none}
  input:focus,select:focus{border-color:#E05C2A}
  select option{background:#1A1A1A}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
  @keyframes pulseRing{0%{transform:scale(1);opacity:.5}100%{transform:scale(1.6);opacity:0}}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

const C = {
  bg:"#0F0F0F",surface:"#1A1A1A",surface2:"#222222",
  border:"#2A2A2A",ember:"#E05C2A",emberLight:"#F4936A",emberDim:"rgba(224,92,42,0.13)",
  sand:"#F2EBD9",mist:"#6B6B6B",white:"#FFFFFF",
  rest:"#3B82F6",restDim:"rgba(59,130,246,0.13)",
  green:"#22C55E",greenDim:"rgba(34,197,94,0.13)",
  purple:"#A855F7",warn:"#FFD166",
};

// Emoji per categoria
const CAT_ICON = {
  "Core & Mobilità":"🌀",
  "Full Body":"⚡",
  "Posteriori":"🦵",
  "Spalle & Upper":"💪",
  "Gambe & Glutei":"🏋️",
};
const catIcon = cat => CAT_ICON[cat] || "🔥";

const BASE_EXERCISES = [
  {id:1,name:"Kettlebell Halo",category:"Core & Mobilità",target:"Obliqui · Spalle · Mobilità toracica",cues:["Tieni il KB a due mani davanti al petto, fondo verso l'alto.","Ruota lentamente attorno alla testa (~3 sec/giro).","Il busto rimane fermo — si muovono solo spalle e braccia.","Alterna direzione ogni 20\"."]},
  {id:2,name:"Goblet Squat",category:"Full Body",target:"Quadricipiti · Glutei · Core",cues:["KB verticale a due mani all'altezza del petto.","Piedi leggermente oltre larghezza spalle, punte fuori.","Scendi con petto alto — i gomiti toccano le ginocchia in basso.","Spingi sui talloni per risalire."]},
  {id:3,name:"Windmill",category:"Core & Mobilità",target:"Obliqui · Fianchi · Mobilità anche",cues:["KB con la mano destra sopra la testa, braccio teso, occhi sul KB.","Piedi a 45° rispetto al braccio alto, peso sulla gamba destra.","Scivola la mano sinistra lungo la gamba verso il pavimento.","Il fulcro è l'anca, non la schiena."]},
  {id:4,name:"Around the World",category:"Core & Mobilità",target:"Core 360° · Obliqui · Coordinazione",cues:["KB in una mano davanti alle cosce.","Fai ruotare il KB attorno al corpo, passa da una mano all'altra.","Busto fisso — le anche non ruotano.","Cambia direzione ogni 20\"."]},
  {id:5,name:"Single-Leg Deadlift",category:"Posteriori",target:"Femorali · Glutei · Equilibrio",cues:["In piedi su una gamba, KB nella mano opposta.","Inclinati in avanti dall'anca come un'altalena.","La gamba libera sale dietro, KB scende parallelo alla tibia.","Nessun movimento dalla lombare."]},
  {id:6,name:"Press in Piedi",category:"Spalle & Upper",target:"Spalle · Core laterale · Stabilità",cues:["KB in rack sulla spalla, polso dritto.","Premi sopra la testa in linea con la spalla.","Contrai il gluteo del lato che preme.","Non inarcare la schiena."]},
  {id:7,name:"Suitcase Carry",category:"Core & Mobilità",target:"Obliqui · Grip · Postura anti-laterale",cues:["KB in una mano, braccio disteso lungo il fianco.","La spalla carica non deve abbassarsi.","Gli obliqui del lato opposto lavorano isometricamente.","Passo lento e controllato."]},
  {id:8,name:"Wood Chops",category:"Core & Mobilità",target:"Obliqui · Rotatori · Potenza rotazionale",cues:["KB a due mani, arco diagonale dall'alto-laterale al basso-opposto.","Ruota il busto, non solo le braccia.","Movimento esplosivo in discesa, controllato in risalita.","x6 per lato."]},
  {id:9,name:"High Pulls",category:"Spalle & Upper",target:"Trapezi · Spalle · Schiena alta",cues:["Parti con il KB basso tra le gambe.","Tira con i gomiti alti verso il petto in modo esplosivo.","Il KB sale fino al petto — coinvolgi schiena e spalle.","Nessuno slancio delle braccia."]},
  {id:10,name:"Curl & Press",category:"Spalle & Upper",target:"Bicipiti → Spalle · Transizione fluida",cues:["Esegui prima un curl portando il KB al petto.","Poi pressa sopra la testa fino a completa estensione.","Gomiti vicini al corpo durante il curl.","Movimento lento e controllato."]},
  {id:11,name:"Horizontal Press",category:"Spalle & Upper",target:"Petto · Tricipiti · Core stabilizzatore",cues:["Spingi in avanti in linea orizzontale.","Non inarcare la schiena — core contratto.","Puoi eseguirlo da seduto o in ginocchio.","2 sec andata, 2 sec ritorno."]},
  {id:12,name:"KB Side Swing",category:"Full Body",target:"Core laterale · Obliqui · Stabilità",cues:["Swinga il KB da un lato all'altro all'altezza dell'anca.","Il movimento parte dai fianchi, non dalle braccia.","Mantieni il core attivo e il busto stabile.","x8 per lato."]},
  {id:13,name:"Reverse Lunge",category:"Gambe & Glutei",target:"Quadricipiti · Glutei · Equilibrio",cues:["Tieni il KB al petto o in una mano.","Fai un passo indietro ampio — ginocchio posteriore verso terra.","Il ginocchio anteriore non supera la punta del piede.","Spingi sul tallone della gamba davanti per tornare."]},
  {id:14,name:"Romanian Deadlift",category:"Posteriori",target:"Femorali · Glutei · Schiena bassa controllata",cues:["KB in entrambe le mani davanti alle cosce.","Inclina il busto spingendo i fianchi indietro.","Schiena neutra per tutta l'esecuzione.","Scendi fino allo stretch nei femorali, risali lentamente."]},
  {id:15,name:"Goblet Squat & Press",category:"Full Body",target:"Gambe · Spalle · Core · Composto",cues:["Parti in posizione goblet squat con il KB al petto.","Scendi in squat profondo con schiena neutra.","In risalita, pressa il KB sopra la testa a braccia tese.","Abbassa il KB al petto prima del prossimo squat."]},
];

const CIRCUITS = [
  {id:"A",name:"Routine A — Core & Upper Body",subtitle:"Stabilità, forza e rotazione per core e parte superiore",tag:"Dopo il padel · Giorni leggeri",color:C.purple,exerciseIds:[8,9,10,1,11,4],structure:"2–3 giri · Recupero 30–45\" tra esercizi · 1–2' tra i giri",focus:["Core","Spalle e schiena","Stabilità e rotazione"]},
  {id:"B",name:"Routine B — Full Body",subtitle:"Forza, potenza e stabilità complete",tag:"Giorni senza padel · Allenamento principale",color:C.ember,exerciseIds:[12,1,15,14,13,7],structure:"2–3 giri · Recupero 45–60\" tra esercizi · 1–2' tra i giri",focus:["Forza totale","Potenza e gambe","Stabilità e core"],note:"Se hai fastidi alla schiena: sostituisci KB Side Swing con Romanian Deadlift."},
];

const BASE_CATEGORIES = ["Core & Mobilità","Full Body","Posteriori","Spalle & Upper","Gambe & Glutei"];
const fmt = s => `${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`;
const beep = (freq=880,dur=0.12,vol=0.3) => {
  try{const ctx=new(window.AudioContext||window.webkitAudioContext)();const osc=ctx.createOscillator();const gain=ctx.createGain();osc.connect(gain);gain.connect(ctx.destination);osc.frequency.value=freq;gain.gain.setValueAtTime(vol,ctx.currentTime);gain.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+dur);osc.start();osc.stop(ctx.currentTime+dur);}catch{}
};

// ─── PLACEHOLDER esercizio ────────────────────────────────────────────────────
function ExPlaceholder({ex, size="md", dimmed=false}){
  const icon = catIcon(ex ? ex.category : "");
  const big = size === "lg";
  const sm = size === "sm";
  return (
    <div style={{
      width:"100%", height:"100%",
      background: dimmed
        ? "rgba(15,15,15,0.85)"
        : `linear-gradient(135deg, #1A1A1A 0%, #252525 100%)`,
      display:"flex", flexDirection:"column",
      alignItems:"center", justifyContent:"center",
      gap: sm ? "0.2rem" : "0.5rem",
      padding: sm ? "0.3rem" : "0.8rem",
      position:"relative", overflow:"hidden",
    }}>
      {/* sfondo decorativo */}
      <div style={{position:"absolute",inset:0,display:"flex",alignItems:"center",justifyContent:"center",opacity:0.04,fontSize: big?"10rem":"5rem",pointerEvents:"none"}}>
        {icon}
      </div>
      <div style={{fontSize: sm?"1.6rem": big?"3.5rem":"2rem", lineHeight:1, position:"relative"}}>{icon}</div>
      {!sm && ex && (
        <div style={{textAlign:"center",position:"relative"}}>
          <div style={{fontFamily:"'Bebas Neue'",fontSize: big?"1.3rem":"0.78rem",color:C.white,letterSpacing:"0.03em",lineHeight:1.1}}>{ex.name}</div>
          <div style={{fontSize: big?"0.72rem":"0.6rem",color:C.ember,marginTop:"0.2rem",letterSpacing:"0.06em",textTransform:"uppercase"}}>{ex.category}</div>
        </div>
      )}
    </div>
  );
}

// ─── MODAL ESERCIZIO ──────────────────────────────────────────────────────────
function ExModal({ex, onClose, onDelete}){
  if(!ex) return null;
  const icon = catIcon(ex.category);
  return(
    <div onClick={onClose} style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.88)",zIndex:200,display:"flex",alignItems:"flex-end",animation:"fadeIn .18s ease"}}>
      <div onClick={e=>e.stopPropagation()} style={{background:C.surface,width:"100%",maxWidth:480,margin:"0 auto",borderRadius:"16px 16px 0 0",overflow:"hidden",animation:"slideUp .22s ease",maxHeight:"88vh",overflowY:"auto"}}>

        {/* Hero placeholder */}
        <div style={{position:"relative",height:200,overflow:"hidden",background:`linear-gradient(135deg,#1A1A1A,#2A2A2A)`}}>
          {/* icona grande sfumata */}
          <div style={{position:"absolute",inset:0,display:"flex",alignItems:"center",justifyContent:"center",fontSize:"9rem",opacity:0.08}}>{icon}</div>
          <div style={{position:"absolute",inset:0,display:"flex",alignItems:"center",justifyContent:"center",fontSize:"4rem"}}>{icon}</div>
          {/* gradient bottom */}
          <div style={{position:"absolute",inset:0,background:"linear-gradient(to bottom,transparent 40%,rgba(26,26,26,0.98) 100%)"}}/>
          <button onClick={onClose} style={{position:"absolute",top:".8rem",right:".8rem",background:"rgba(0,0,0,.55)",border:"none",color:C.white,width:32,height:32,borderRadius:"50%",cursor:"pointer",fontSize:"1rem"}}>✕</button>
          {ex.custom&&<div style={{position:"absolute",top:".8rem",left:".8rem",background:C.green,color:C.white,fontSize:".6rem",fontWeight:700,letterSpacing:".1em",textTransform:"uppercase",padding:".2rem .55rem",borderRadius:"2rem"}}>CUSTOM</div>}
          <div style={{position:"absolute",bottom:".8rem",left:"1rem",right:"1rem"}}>
            <div style={{fontSize:".62rem",color:C.ember,letterSpacing:".1em",textTransform:"uppercase",marginBottom:".2rem"}}>{ex.category}</div>
            <div style={{fontFamily:"'Bebas Neue'",fontSize:"1.9rem",color:C.white,lineHeight:1}}>{ex.name}</div>
            {ex.target&&<div style={{fontSize:".7rem",color:C.emberLight,marginTop:".25rem"}}>{ex.target}</div>}
          </div>
        </div>

        <div style={{padding:"1.1rem 1.2rem 1.8rem"}}>
          {ex.cues&&ex.cues.length>0&&<>
            <div style={{fontSize:".62rem",letterSpacing:".12em",color:C.mist,textTransform:"uppercase",marginBottom:".7rem"}}>Tecnica</div>
            {ex.cues.map((cue,i)=>(
              <div key={i} style={{display:"flex",gap:".7rem",padding:".5rem 0",borderBottom:i<ex.cues.length-1?`1px solid ${C.border}`:"none"}}>
                <div style={{color:C.ember,fontFamily:"'Bebas Neue'",fontSize:"1rem",minWidth:"1.2rem",lineHeight:1.4}}>{i+1}</div>
                <div style={{fontSize:".82rem",color:C.sand,lineHeight:1.55}}>{cue}</div>
              </div>
            ))}
          </>}
          {ex.custom&&onDelete&&(
            <button onClick={()=>{onDelete(ex.id);onClose();}} style={{marginTop:"1.2rem",width:"100%",padding:".75rem",borderRadius:10,background:"rgba(239,68,68,.12)",border:"1px solid rgba(239,68,68,.3)",color:"#EF4444",fontFamily:"'DM Sans'",fontSize:".82rem",cursor:"pointer"}}>
              🗑 Elimina esercizio
            </button>
          )}
        </div>
      </div>
    </div>
  );
}

// ─── MODAL AGGIUNGI ───────────────────────────────────────────────────────────
function AddExModal({onClose,onSave,categories}){
  const [name,setName]=useState("");
  const [cat,setCat]=useState(categories[0]||BASE_CATEGORIES[0]);
  const [customCat,setCustomCat]=useState("");
  const [useCustomCat,setUseCustomCat]=useState(false);
  const finalCat=useCustomCat?customCat.trim():cat;
  const canSave=name.trim().length>1&&finalCat.length>0;
  const handleSave=()=>{
    if(!canSave)return;
    onSave({id:`custom_${Date.now()}`,name:name.trim(),category:finalCat,target:"",cues:[],custom:true});
    onClose();
  };
  return(
    <div onClick={onClose} style={{position:"fixed",inset:0,background:"rgba(0,0,0,.9)",zIndex:300,display:"flex",alignItems:"flex-end",animation:"fadeIn .18s ease"}}>
      <div onClick={e=>e.stopPropagation()} style={{background:C.surface,width:"100%",maxWidth:480,margin:"0 auto",borderRadius:"16px 16px 0 0",animation:"slideUp .22s ease",maxHeight:"90vh",overflowY:"auto"}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"1rem 1.2rem",borderBottom:`1px solid ${C.border}`}}>
          <div style={{fontFamily:"'Bebas Neue'",fontSize:"1.4rem",color:C.white,letterSpacing:".04em"}}>Nuovo <span style={{color:C.green}}>Esercizio</span></div>
          <button onClick={onClose} style={{background:"none",border:"none",color:C.mist,cursor:"pointer",fontSize:"1.1rem"}}>✕</button>
        </div>
        <div style={{padding:"1.2rem"}}>
          <div style={{display:"flex",flexDirection:"column",gap:".9rem"}}>
            <div>
              <label style={{fontSize:".68rem",color:C.mist,letterSpacing:".1em",textTransform:"uppercase",display:"block",marginBottom:".4rem"}}>Nome esercizio *</label>
              <input type="text" placeholder="es. Turkish Get-Up" value={name} onChange={e=>setName(e.target.value)}/>
            </div>
            <div>
              <label style={{fontSize:".68rem",color:C.mist,letterSpacing:".1em",textTransform:"uppercase",display:"block",marginBottom:".4rem"}}>Categoria *</label>
              {!useCustomCat?(
                <div style={{display:"flex",gap:".5rem"}}>
                  <select value={cat} onChange={e=>setCat(e.target.value)} style={{flex:1}}>
                    {categories.map(c=><option key={c} value={c}>{c}</option>)}
                  </select>
                  <button onClick={()=>setUseCustomCat(true)} style={{padding:".65rem .8rem",borderRadius:8,background:"none",border:`1px solid ${C.border}`,color:C.mist,cursor:"pointer",fontSize:".75rem",whiteSpace:"nowrap",fontFamily:"'DM Sans'"}}>+ Nuova</button>
                </div>
              ):(
                <div style={{display:"flex",gap:".5rem"}}>
                  <input type="text" placeholder="Nome categoria..." value={customCat} onChange={e=>setCustomCat(e.target.value)} style={{flex:1}}/>
                  <button onClick={()=>{setUseCustomCat(false);setCustomCat("");}} style={{padding:".65rem .8rem",borderRadius:8,background:"none",border:`1px solid ${C.border}`,color:C.mist,cursor:"pointer",fontSize:".75rem",fontFamily:"'DM Sans'"}}>✕</button>
                </div>
              )}
            </div>
          </div>
          <div style={{display:"flex",gap:".7rem",marginTop:"1.4rem"}}>
            <button onClick={onClose} style={{flex:1,padding:".9rem",borderRadius:10,background:"none",border:`1px solid ${C.border}`,color:C.mist,fontFamily:"'DM Sans'",fontSize:".85rem",cursor:"pointer"}}>Annulla</button>
            <button onClick={handleSave} disabled={!canSave} style={{flex:2,padding:".9rem",borderRadius:10,background:canSave?C.green:C.border,border:"none",color:C.white,fontFamily:"'Bebas Neue'",fontSize:"1.15rem",letterSpacing:".06em",cursor:canSave?"pointer":"not-allowed",transition:"background .2s"}}>SALVA</button>
          </div>
        </div>
      </div>
    </div>
  );
}

// ─── EXERCISE CARD ────────────────────────────────────────────────────────────
function ExCard({ex,selected,onToggle,onInfo}){
  const isSel=selected;
  const icon=catIcon(ex.category);
  return(
    <div style={{border:`1px solid ${isSel?C.ember:C.border}`,borderRadius:12,overflow:"hidden",background:isSel?C.emberDim:C.surface,transition:"all .15s"}}>
      <div style={{display:"flex",gap:".85rem",padding:".8rem"}}>
        {/* Placeholder quadrato */}
        <div onClick={()=>onInfo(ex)} style={{width:66,height:66,borderRadius:8,overflow:"hidden",flexShrink:0,background:`linear-gradient(135deg,#1E1E1E,#282828)`,cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:"0.15rem",border:`1px solid ${C.border}`}}>
          <div style={{fontSize:"1.8rem",lineHeight:1}}>{icon}</div>
        </div>
        <div style={{flex:1,minWidth:0}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:".4rem"}}>
            <div style={{flex:1,minWidth:0}}>
              <button onClick={()=>onInfo(ex)} style={{background:"none",border:"none",padding:0,cursor:"pointer",fontWeight:600,fontSize:".88rem",color:C.white,textAlign:"left",textDecoration:"underline",textDecorationColor:"rgba(255,255,255,.2)",fontFamily:"'DM Sans'",width:"100%"}}>{ex.name}</button>
              <div style={{display:"flex",alignItems:"center",gap:".4rem",marginTop:".15rem"}}>
                <div style={{fontSize:".65rem",color:C.ember,letterSpacing:".07em",textTransform:"uppercase"}}>{ex.category}</div>
                {ex.custom&&<div style={{fontSize:".58rem",background:C.greenDim,color:C.green,padding:".05rem .4rem",borderRadius:"2rem",letterSpacing:".06em",textTransform:"uppercase"}}>custom</div>}
              </div>
              {ex.target&&<div style={{fontSize:".71rem",color:C.mist,marginTop:".1rem",lineHeight:1.35}}>{ex.target}</div>}
            </div>
            <div onClick={()=>onToggle(ex)} style={{width:26,height:26,borderRadius:"50%",flexShrink:0,cursor:"pointer",border:`2px solid ${isSel?C.ember:C.border}`,background:isSel?C.ember:"none",display:"flex",alignItems:"center",justifyContent:"center",color:C.white,fontSize:".72rem",transition:"all .15s"}}>
              {isSel?"✓":""}
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

// ─── PLAYER VIEW ─────────────────────────────────────────────────────────────
function PlayerView({phase,workout,running,done,onToggle,onReset,onBack,onInfo,series,selected}){
  if(done)return(
    <div style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:"2rem",textAlign:"center"}}>
      <div style={{fontSize:"4rem",marginBottom:"1rem"}}>🏆</div>
      <div style={{fontFamily:"'Bebas Neue'",fontSize:"3rem",color:C.ember,lineHeight:1}}>WORKOUT<br/>COMPLETATO</div>
      <p style={{color:C.mist,margin:"1rem 0 2rem",fontSize:".85rem"}}>{series} serie · {selected.length} esercizi</p>
      <button onClick={onReset} style={{width:"100%",padding:"1rem",borderRadius:12,background:C.ember,border:"none",color:C.white,fontFamily:"'Bebas Neue'",fontSize:"1.2rem",cursor:"pointer",marginBottom:".8rem"}}>↺ Ripeti</button>
      <button onClick={onBack} style={{width:"100%",padding:"1rem",borderRadius:12,background:C.surface,border:`1px solid ${C.border}`,color:C.sand,fontFamily:"'DM Sans'",fontSize:".85rem",cursor:"pointer"}}>← Builder</button>
    </div>
  );

  const isWork=phase.type==="work";
  const isSRest=phase.type==="series-rest";
  const accent=isWork?C.ember:C.rest;
  const circ=2*Math.PI*45;
  const dash=circ*(1-phase.timeLeft/(phase.dur||1));
  const steps=workout.filter(w=>w.type!=="end");
  const icon = phase.ex ? catIcon(phase.ex.category) : "🔥";

  return(
    <div style={{flex:1,display:"flex",flexDirection:"column"}}>
      {/* progress bar */}
      <div style={{padding:".7rem 1rem",display:"flex",alignItems:"center",gap:".8rem",borderBottom:`1px solid ${C.border}`}}>
        <button onClick={onBack} style={{background:"none",border:"none",color:C.mist,cursor:"pointer",fontSize:"1.1rem"}}>←</button>
        <div style={{flex:1}}>
          <div style={{fontSize:".6rem",color:C.mist,letterSpacing:".1em",textTransform:"uppercase",marginBottom:".22rem"}}>
            {isWork?`Serie ${phase.serie} · ${phase.ex&&phase.ex.name}`:isSRest?`Fine serie ${phase.serie-1}`:"Riposo"}
          </div>
          <div style={{height:3,background:C.border,borderRadius:2}}>
            <div style={{height:"100%",borderRadius:2,background:accent,width:`${(phase.idx/Math.max(steps.length-1,1))*100}%`,transition:"width .6s"}}/>
          </div>
        </div>
        <div style={{fontSize:".7rem",color:C.mist}}>{phase.idx+1}/{steps.length}</div>
      </div>

      {/* hero placeholder */}
      {phase.ex&&(
        <div style={{position:"relative",height:220,background:`linear-gradient(135deg,#111,#1E1E1E)`,overflow:"hidden",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:"0.6rem"}}>
          {/* icona sfondo */}
          <div style={{position:"absolute",fontSize:"14rem",opacity: isWork ? 0.06 : 0.03,pointerEvents:"none",lineHeight:1}}>{icon}</div>
          {/* badge fase */}
          <div style={{position:"absolute",top:".8rem",left:".8rem",background:accent,color:C.white,fontSize:".6rem",fontWeight:700,letterSpacing:".12em",textTransform:"uppercase",padding:".2rem .55rem",borderRadius:"2rem",zIndex:2}}>
            {isWork?"● LAVORO":"◉ RIPOSO"}
          </div>
          {/* contenuto centrale */}
          <div style={{fontSize:"4rem",lineHeight:1,position:"relative",zIndex:1}}>{icon}</div>
          <div style={{position:"relative",zIndex:1,textAlign:"center",padding:"0 1rem"}}>
            <button onClick={()=>onInfo(phase.ex)} style={{background:"none",border:"none",padding:0,cursor:"pointer",fontFamily:"'Bebas Neue'",fontSize:"1.7rem",color: isWork ? C.white : C.mist,letterSpacing:".03em",lineHeight:1,textDecoration:"underline",textDecorationColor:"rgba(255,255,255,.25)"}}>
              {isWork?phase.ex.name:isSRest?`Prossima: ${phase.ex.name}`:`Prossimo: ${phase.ex.name}`}
            </button>
            {isWork&&phase.ex.target&&<div style={{fontSize:".68rem",color:C.emberLight,marginTop:".2rem"}}>{phase.ex.target}</div>}
          </div>
        </div>
      )}

      {/* timer */}
      <div style={{display:"flex",flexDirection:"column",alignItems:"center",padding:"1.2rem 1rem .7rem"}}>
        <div style={{position:"relative",width:140,height:140}}>
          {running&&isWork&&<div style={{position:"absolute",inset:-10,borderRadius:"50%",border:`2px solid ${C.ember}`,opacity:0,animation:"pulseRing 1.6s ease-out infinite"}}/>}
          <svg width="140" height="140" style={{transform:"rotate(-90deg)"}}>
            <circle cx="70" cy="70" r="45" fill="none" stroke={C.border} strokeWidth="6"/>
            <circle cx="70" cy="70" r="45" fill="none" stroke={accent} strokeWidth="6" strokeLinecap="round" strokeDasharray={circ} strokeDashoffset={dash} style={{transition:"stroke-dashoffset .9s linear"}}/>
          </svg>
          <div style={{position:"absolute",inset:0,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center"}}>
            <div style={{fontFamily:"'Bebas Neue'",fontSize:"2.6rem",color:phase.timeLeft<=3&&isWork?C.ember:C.white,lineHeight:1,transition:"color .2s"}}>{fmt(phase.timeLeft)}</div>
            <div style={{fontSize:".57rem",color:C.mist,letterSpacing:".1em",textTransform:"uppercase"}}>{isWork?"lavoro":"riposo"}</div>
          </div>
        </div>
        {isWork&&phase.ex&&phase.ex.cues&&phase.ex.cues[0]&&(
          <div style={{marginTop:".65rem",padding:".5rem .85rem",background:C.emberDim,borderRadius:8,fontSize:".72rem",color:C.emberLight,fontStyle:"italic",textAlign:"center",maxWidth:320}}>{phase.ex.cues[0]}</div>
        )}
        {!isWork&&(
          <div style={{marginTop:".65rem",padding:".5rem .85rem",background:C.restDim,borderRadius:8,fontSize:".72rem",color:C.rest,textAlign:"center",maxWidth:320}}>
            {isSRest?"Fine serie. Recupera e preparati.":"Respira. Prossimo esercizio tra poco."}
          </div>
        )}
      </div>

      {/* controlli */}
      <div style={{padding:"0 1rem 1.5rem",display:"flex",gap:".7rem",marginTop:"auto"}}>
        <button onClick={onReset} style={{flex:1,padding:".9rem",borderRadius:12,background:C.surface,border:`1px solid ${C.border}`,color:C.sand,fontFamily:"'DM Sans'",fontSize:".82rem",cursor:"pointer"}}>↺</button>
        <button onClick={onToggle} style={{flex:3,padding:".9rem",borderRadius:12,background:running?C.surface:accent,border:running?`1px solid ${C.border}`:"none",color:running?C.sand:C.white,fontFamily:"'Bebas Neue'",fontSize:"1.3rem",letterSpacing:".06em",cursor:"pointer",transition:"all .15s"}}>
          {running?"⏸ PAUSA":"▶ AVVIA"}
        </button>
      </div>
    </div>
  );
}

// ─── APP ──────────────────────────────────────────────────────────────────────
function App(){
  const [tab,setTab]=useState("library");
  const [filterCat,setFilterCat]=useState("Tutti");
  const [selected,setSelected]=useState([]);
  const [modalEx,setModalEx]=useState(null);
  const [showAdd,setShowAdd]=useState(false);
  const [customExercises,setCustomExercises]=useState(()=>{try{return JSON.parse(localStorage.getItem("kb_custom")||"[]");}catch{return [];}});
  useEffect(()=>{try{localStorage.setItem("kb_custom",JSON.stringify(customExercises));}catch{}},[customExercises]);

  const allEx=[...BASE_EXERCISES,...customExercises];
  const allCats=[...BASE_CATEGORIES,...customExercises.map(e=>e.category).filter(c=>!BASE_CATEGORIES.includes(c))];
  const uniqueCats=[...new Set(allCats)];
  const filterOpts=["Tutti","Custom",...uniqueCats];
  const saveCustom=ex=>setCustomExercises(p=>[...p,ex]);
  const deleteCustom=id=>{setCustomExercises(p=>p.filter(e=>e.id!==id));setSelected(p=>p.filter(e=>e.id!==id));};
  const toggleEx=ex=>setSelected(p=>p.find(e=>e.id===ex.id)?p.filter(e=>e.id!==ex.id):[...p,ex]);
  const loadCircuit=c=>{setSelected(c.exerciseIds.map(id=>allEx.find(e=>e.id===id)).filter(Boolean));setTab("builder");};
  const filtered=filterCat==="Tutti"?allEx:filterCat==="Custom"?customExercises:allEx.filter(e=>e.category===filterCat);

  const [workTime,setWorkTime]=useState(40);
  const [restTime,setRestTime]=useState(20);
  const [series,setSeries]=useState(3);
  const [restBetween,setRestBetween]=useState(90);
  const [musicUrl,setMusicUrl]=useState("");
  const [workout,setWorkout]=useState(null);
  const [phase,setPhase]=useState(null);
  const [running,setRunning]=useState(false);
  const [done,setDone]=useState(false);
  const timerRef=useRef(null);

  const buildWorkout=()=>{
    const seq=[];
    for(let s=0;s<series;s++){
      selected.forEach((ex,i)=>{
        seq.push({type:"work",ex,serie:s+1,dur:workTime});
        const last=i===selected.length-1;
        if(!last)seq.push({type:"rest",ex:selected[i+1],serie:s+1,dur:restTime});
        else if(s<series-1)seq.push({type:"series-rest",ex:selected[0],serie:s+2,dur:restBetween});
      });
    }
    seq.push({type:"end"});
    return seq;
  };

  const startWorkout=()=>{
    if(!selected.length)return;
    const seq=buildWorkout();
    setWorkout(seq);setPhase({idx:0,...seq[0],timeLeft:seq[0].dur});
    setRunning(false);setDone(false);setTab("player");
    if(musicUrl)window.open(musicUrl,"_blank");
  };

  useEffect(()=>{
    if(!running||!phase||phase.type==="end")return;
    timerRef.current=setInterval(()=>{
      setPhase(prev=>{
        if(!prev)return prev;
        const next=prev.timeLeft-1;
        if(next<=3&&next>0)beep(prev.type==="work"?440:330,.08,.12);
        if(next<=0){
          beep(prev.type==="work"?660:440,.18);
          const ni=prev.idx+1;
          if(!workout[ni]||workout[ni].type==="end"){clearInterval(timerRef.current);setRunning(false);setDone(true);beep(880,.3);setTimeout(()=>beep(1100,.3),250);return{...prev,type:"end",timeLeft:0};}
          return{...workout[ni],idx:ni,timeLeft:workout[ni].dur};
        }
        return{...prev,timeLeft:next};
      });
    },1000);
    return()=>clearInterval(timerRef.current);
  },[running,phase&&phase.idx]);

  const totalTime=selected.length?series*(selected.length*workTime+(selected.length-1)*restTime)+(series-1)*restBetween:0;

  return(
    <div>
      {modalEx&&<ExModal ex={modalEx} onClose={()=>setModalEx(null)} onDelete={deleteCustom}/>}
      {showAdd&&<AddExModal onClose={()=>setShowAdd(false)} onSave={saveCustom} categories={uniqueCats}/>}
      <div style={{maxWidth:480,margin:"0 auto",minHeight:"100vh",display:"flex",flexDirection:"column"}}>

        {/* NAV */}
        <nav style={{display:"flex",borderBottom:`1px solid ${C.border}`,background:C.bg,position:"sticky",top:0,zIndex:100}}>
          {[["library","📚 Libreria"],["circuits","⚡ Circuiti"],["builder",`⚙️${selected.length?` (${selected.length})`:""}`],...(tab==="player"?[["player","▶ Player"]]:[])]
            .map(([v,label])=>(
              <button key={v} onClick={()=>setTab(v)} style={{flex:1,padding:".85rem .3rem",background:"none",border:"none",cursor:"pointer",fontFamily:"'DM Sans'",fontSize:".7rem",fontWeight:600,color:tab===v?C.ember:C.mist,borderBottom:tab===v?`2px solid ${C.ember}`:"2px solid transparent",transition:"color .2s",whiteSpace:"nowrap"}}>{label}</button>
            ))}
        </nav>

        {/* ── LIBRERIA ── */}
        {tab==="library"&&(
          <div style={{flex:1,padding:"1.1rem 1rem"}}>
            <div style={{display:"flex",alignItems:"flex-end",justifyContent:"space-between",marginBottom:".15rem"}}>
              <div style={{fontFamily:"'Bebas Neue'",fontSize:"1.8rem",color:C.white,letterSpacing:".04em"}}>Libreria <span style={{color:C.ember}}>Esercizi</span></div>
              <button onClick={()=>setShowAdd(true)} style={{padding:".45rem .9rem",borderRadius:8,background:C.greenDim,border:`1px solid ${C.green}44`,color:C.green,fontSize:".75rem",fontFamily:"'DM Sans'",fontWeight:600,cursor:"pointer"}}>+ Aggiungi</button>
            </div>
            <p style={{fontSize:".74rem",color:C.mist,marginBottom:"1rem"}}>Tap nome → tecnica. Tap ✓ → aggiungi al workout.</p>
            <div style={{display:"flex",gap:".4rem",overflowX:"auto",paddingBottom:".8rem",marginBottom:".8rem",scrollbarWidth:"none"}}>
              {filterOpts.map(cat=>(
                <button key={cat} onClick={()=>setFilterCat(cat)} style={{padding:".28rem .72rem",borderRadius:"2rem",border:`1px solid ${filterCat===cat?(cat==="Custom"?C.green:C.ember):C.border}`,background:filterCat===cat?(cat==="Custom"?C.greenDim:C.emberDim):"none",color:filterCat===cat?(cat==="Custom"?C.green:C.emberLight):C.mist,fontSize:".7rem",cursor:"pointer",whiteSpace:"nowrap",fontFamily:"'DM Sans'",transition:"all .15s"}}>{cat}</button>
              ))}
            </div>
            <div style={{display:"flex",flexDirection:"column",gap:".65rem"}}>
              {filtered.length===0?(
                <div style={{textAlign:"center",padding:"2rem",color:C.mist,fontSize:".82rem"}}>
                  {filterCat==="Custom"?(<><div style={{fontSize:"2rem",marginBottom:".5rem"}}>🏋️</div>Nessun esercizio custom.<br/><button onClick={()=>setShowAdd(true)} style={{marginTop:".8rem",padding:".6rem 1.2rem",borderRadius:8,background:C.greenDim,border:`1px solid ${C.green}44`,color:C.green,fontSize:".8rem",fontFamily:"'DM Sans'",cursor:"pointer"}}>+ Aggiungi il primo</button></>):"Nessun esercizio trovato."}
                </div>
              ):filtered.map(ex=>(
                <ExCard key={ex.id} ex={ex} selected={!!selected.find(e=>e.id===ex.id)} onToggle={toggleEx} onInfo={setModalEx}/>
              ))}
            </div>
            {selected.length>0&&<button onClick={()=>setTab("builder")} style={{marginTop:"1.2rem",width:"100%",padding:"1rem",borderRadius:12,background:C.ember,border:"none",color:C.white,fontFamily:"'Bebas Neue'",fontSize:"1.2rem",letterSpacing:".06em",cursor:"pointer"}}>Configura Workout → {selected.length} esercizi</button>}
          </div>
        )}

        {/* ── CIRCUITI ── */}
        {tab==="circuits"&&(
          <div style={{flex:1,padding:"1.1rem 1rem"}}>
            <div style={{fontFamily:"'Bebas Neue'",fontSize:"1.8rem",color:C.white,letterSpacing:".04em",marginBottom:".15rem"}}>Circuiti <span style={{color:C.ember}}>Pronti</span></div>
            <p style={{fontSize:".74rem",color:C.mist,marginBottom:"1.2rem"}}>Tap su un esercizio per la tecnica. Carica nel builder per personalizzare.</p>
            {CIRCUITS.map(circuit=>{
              const exs=circuit.exerciseIds.map(id=>allEx.find(e=>e.id===id)).filter(Boolean);
              return(
                <div key={circuit.id} style={{background:C.surface,border:`1px solid ${circuit.color}33`,borderRadius:14,overflow:"hidden",marginBottom:"1.2rem"}}>
                  <div style={{background:`${circuit.color}15`,padding:"1rem 1.1rem .8rem",borderBottom:`1px solid ${circuit.color}22`}}>
                    <div style={{display:"flex",alignItems:"flex-start",justifyContent:"space-between",gap:".5rem"}}>
                      <div>
                        <div style={{fontSize:".62rem",color:circuit.color,letterSpacing:".1em",textTransform:"uppercase",marginBottom:".2rem"}}>{circuit.tag}</div>
                        <div style={{fontFamily:"'Bebas Neue'",fontSize:"1.35rem",color:C.white,lineHeight:1.1}}>{circuit.name}</div>
                        <div style={{fontSize:".72rem",color:C.mist,marginTop:".2rem"}}>{circuit.subtitle}</div>
                      </div>
                      <div style={{background:circuit.color,color:C.white,borderRadius:"50%",width:34,height:34,display:"flex",alignItems:"center",justifyContent:"center",fontFamily:"'Bebas Neue'",fontSize:"1.2rem",flexShrink:0}}>{circuit.id}</div>
                    </div>
                    <div style={{display:"flex",gap:".4rem",flexWrap:"wrap",marginTop:".6rem"}}>
                      {circuit.focus.map(f=><span key={f} style={{fontSize:".62rem",padding:".18rem .5rem",borderRadius:"2rem",background:`${circuit.color}22`,color:circuit.color}}>{f}</span>)}
                    </div>
                  </div>
                  <div style={{padding:".7rem 1.1rem"}}>
                    <div style={{fontSize:".6rem",color:C.mist,letterSpacing:".1em",textTransform:"uppercase",marginBottom:".45rem"}}>Esercizi</div>
                    {exs.map((ex,i)=>(
                      <div key={ex.id} style={{display:"flex",alignItems:"center",gap:".65rem",padding:".42rem 0",borderBottom:i<exs.length-1?`1px solid ${C.border}`:"none"}}>
                        <div style={{width:36,height:36,borderRadius:6,background:"#1E1E1E",border:`1px solid ${C.border}`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:"1.2rem",flexShrink:0}}>{catIcon(ex.category)}</div>
                        <div style={{flex:1}}>
                          <button onClick={()=>setModalEx(ex)} style={{background:"none",border:"none",padding:0,cursor:"pointer",fontSize:".82rem",color:C.white,fontFamily:"'DM Sans'",fontWeight:500,textDecoration:"underline",textDecorationColor:"rgba(255,255,255,.2)",textAlign:"left"}}>{ex.name}</button>
                          {ex.target&&<div style={{fontSize:".66rem",color:C.mist}}>{ex.target}</div>}
                        </div>
                        <div style={{fontSize:".63rem",color:circuit.color,fontWeight:600}}>#{i+1}</div>
                      </div>
                    ))}
                  </div>
                  <div style={{padding:".55rem 1.1rem",borderTop:`1px solid ${C.border}`}}>
                    <div style={{fontSize:".7rem",color:C.mist}}>📋 {circuit.structure}</div>
                    {circuit.note&&<div style={{fontSize:".68rem",color:C.warn,fontStyle:"italic",marginTop:".25rem"}}>⚠️ {circuit.note}</div>}
                  </div>
                  <div style={{padding:"0 1.1rem 1rem"}}>
                    <button onClick={()=>loadCircuit(circuit)} style={{width:"100%",padding:".82rem",borderRadius:10,background:circuit.color,border:"none",color:C.white,fontFamily:"'Bebas Neue'",fontSize:"1.1rem",letterSpacing:".06em",cursor:"pointer"}}>Carica nel Builder →</button>
                  </div>
                </div>
              );
            })}
          </div>
        )}

        {/* ── BUILDER ── */}
        {tab==="builder"&&(
          <div style={{flex:1,padding:"1.1rem 1rem"}}>
            <div style={{fontFamily:"'Bebas Neue'",fontSize:"1.8rem",color:C.white,letterSpacing:".04em",marginBottom:".15rem"}}>Configura <span style={{color:C.ember}}>Workout</span></div>
            <p style={{fontSize:".74rem",color:C.mist,marginBottom:"1rem"}}>Imposta tempi e serie.</p>
            <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:12,padding:".9rem",marginBottom:".85rem"}}>
              <div style={{fontSize:".63rem",letterSpacing:".12em",color:C.mist,textTransform:"uppercase",marginBottom:".55rem"}}>Ordine Circuito</div>
              {selected.length===0?<div style={{fontSize:".8rem",color:C.mist,textAlign:"center",padding:".6rem 0"}}>Nessun esercizio selezionato</div>:
                selected.map((ex,i)=>(
                  <div key={ex.id} style={{display:"flex",alignItems:"center",gap:".55rem",padding:".4rem 0",borderBottom:i<selected.length-1?`1px solid ${C.border}`:"none"}}>
                    <span style={{color:C.ember,fontFamily:"'Bebas Neue'",fontSize:"1rem",minWidth:"1.4rem"}}>{i+1}</span>
                    <span style={{fontSize:"1rem"}}>{catIcon(ex.category)}</span>
                    <button onClick={()=>setModalEx(ex)} style={{flex:1,background:"none",border:"none",padding:0,cursor:"pointer",fontSize:".83rem",color:C.sand,fontFamily:"'DM Sans'",textAlign:"left",textDecoration:"underline",textDecorationColor:"rgba(242,235,217,.22)"}}>{ex.name}</button>
                    {ex.custom&&<span style={{fontSize:".58rem",color:C.green,border:`1px solid ${C.green}44`,padding:".1rem .35rem",borderRadius:"2rem"}}>custom</span>}
                    <button onClick={()=>toggleEx(ex)} style={{background:"none",border:"none",color:C.mist,cursor:"pointer",fontSize:".9rem"}}>✕</button>
                  </div>
                ))}
              <button onClick={()=>setTab("library")} style={{marginTop:".65rem",fontSize:".73rem",color:C.ember,background:"none",border:"none",cursor:"pointer",padding:0}}>+ Aggiungi esercizi</button>
            </div>
            {[
              {label:"Tempo lavoro",val:workTime,set:setWorkTime,min:15,max:90,step:5,unit:'"',color:C.ember},
              {label:"Riposo tra esercizi",val:restTime,set:setRestTime,min:10,max:60,step:5,unit:'"',color:C.rest},
              {label:"Serie",val:series,set:setSeries,min:1,max:6,step:1,unit:"",color:C.green},
              {label:"Riposo tra serie",val:restBetween,set:setRestBetween,min:30,max:180,step:15,unit:'"',color:C.rest},
            ].map(({label,val,set,min,max,step,unit,color})=>(
              <div key={label} style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:12,padding:".85rem",marginBottom:".65rem"}}>
                <div style={{display:"flex",justifyContent:"space-between",marginBottom:".55rem"}}>
                  <span style={{fontSize:".8rem",color:C.sand}}>{label}</span>
                  <span style={{fontFamily:"'Bebas Neue'",fontSize:"1.4rem",color,lineHeight:1}}>{val}{unit}</span>
                </div>
                <input type="range" min={min} max={max} step={step} value={val} onChange={e=>set(Number(e.target.value))} style={{accentColor:color}}/>
                <div style={{display:"flex",justifyContent:"space-between",marginTop:".18rem",fontSize:".6rem",color:C.mist}}><span>{min}{unit}</span><span>{max}{unit}</span></div>
              </div>
            ))}
            <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:12,padding:".85rem",marginBottom:".85rem"}}>
              <div style={{fontSize:".63rem",letterSpacing:".12em",color:C.mist,textTransform:"uppercase",marginBottom:".55rem"}}>🎵 Musica (opzionale)</div>
              <input type="url" placeholder="URL Spotify o YouTube..." value={musicUrl} onChange={e=>setMusicUrl(e.target.value)}/>
              <p style={{fontSize:".65rem",color:C.mist,marginTop:".35rem"}}>Si apre in nuova scheda all'avvio.</p>
            </div>
            <div style={{background:C.emberDim,border:"1px solid rgba(224,92,42,.2)",borderRadius:12,padding:".85rem",marginBottom:"1rem"}}>
              <div style={{fontSize:".63rem",letterSpacing:".12em",color:C.ember,textTransform:"uppercase",marginBottom:".45rem"}}>Riepilogo</div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",textAlign:"center"}}>
                {[[series,"Serie"],[selected.length,"Esercizi"],[fmt(totalTime),"Durata"]].map(([v,l])=>(
                  <div key={l}><div style={{fontFamily:"'Bebas Neue'",fontSize:"1.6rem",color:C.ember,lineHeight:1}}>{v}</div><div style={{fontSize:".6rem",color:C.mist,letterSpacing:".08em",textTransform:"uppercase"}}>{l}</div></div>
                ))}
              </div>
            </div>
            <button onClick={startWorkout} disabled={!selected.length} style={{width:"100%",padding:"1.1rem",borderRadius:12,background:selected.length?C.ember:C.border,border:"none",color:C.white,fontFamily:"'Bebas Neue'",fontSize:"1.4rem",letterSpacing:".08em",cursor:selected.length?"pointer":"not-allowed",transition:"background .2s"}}>▶ AVVIA WORKOUT</button>
          </div>
        )}

        {/* ── PLAYER ── */}
        {tab==="player"&&phase&&(
          <PlayerView phase={phase} workout={workout} running={running} done={done} series={series} selected={selected}
            onToggle={()=>setRunning(r=>!r)}
            onInfo={setModalEx}
            onReset={()=>{clearInterval(timerRef.current);setRunning(false);setDone(false);setPhase({idx:0,...workout[0],timeLeft:workout[0].dur});}}
            onBack={()=>{clearInterval(timerRef.current);setRunning(false);setDone(false);setTab("builder");}}
          />
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
